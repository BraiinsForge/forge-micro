[package]
name    = "eth-examples"
edition = "2021"
version = "0.1.0"

[lib]
path = "src/lib.rs"

[features]
default = ["defmt"]
defmt   = ["dep:defmt", "embassy-net/defmt", "edge-mdns/defmt", "ubos-logging/defmt"]

[dependencies]
embassy-net       = { workspace = true, features = ["tcp", "udp", "dns", "dhcpv4", "medium-ethernet", "auto-icmp-echo-reply", "multicast"] }
embassy-sync      = { workspace = true }
embassy-time      = { workspace = true }
embassy-futures   = { workspace = true }
embedded-tls      = { workspace = true }
embedded-io-async = { workspace = true }
edge-mdns         = { workspace = true, features = ["io"] }
edge-nal          = { workspace = true }
edge-nal-embassy  = { workspace = true, features = ["udp", "multicast", "proto-ipv4", "medium-ethernet"] }
embedded-hal      = { workspace = true }
embedded-hal-async = { workspace = true }
rand_core         = { workspace = true }
# TODO: remove rand_core_v010 alias once edge-mdns moves back to rand_core 0.6
# or the workspace migrates to 0.10. edge-mdns master depends on rand_core 0.10;
# aliased here so CounterRng can implement the trait that Mdns::new requires,
# without touching the workspace rand_core 0.6 used by embedded-tls.
rand_core_v010    = { package = "rand_core", version = "0.10", default-features = false }
portable-atomic   = { workspace = true }
static_cell       = { workspace = true }
heapless          = { workspace = true }
defmt             = { workspace = true, optional = true }
embedded-graphics = { workspace = true }
profont           = { workspace = true }
format_no_std     = { workspace = true }
sha2              = { workspace = true }
ubos-logging      = { workspace = true }
# Base58check decode for `POOL_SV2_PUBKEY`. `no_std` build via
# `default-features = false`, matches micro-sv2's posture.
bs58              = { version = "0.5", default-features = false, features = ["check"] }

[dev-dependencies]
# Host tests assemble base58check strings via `.into_string()`,
# which needs the `alloc` feature on top of `check`. The lib
# build never sees the extra feature.
bs58              = { version = "0.5", default-features = false, features = ["check", "alloc"] }

# Cortex-M boards drive embassy's `raw::Executor` directly via
# `cpu_load::run_cortex_m_executor`. Gated to ARM so the ESP32-S3
# build does not pull in the cortex-m crate.
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m          = "0.7"
embassy-executor  = { workspace = true }

[workspace]
resolver = "2"
members = [
    "firmware/bmm-pico",
    "firmware/rp2040",
    "firmware/rp2350",
    "firmware/stm32f407",
    "firmware/stm32f439",
    "firmware/esp32s3",
    "asic-cpu-mock",
    "asic-uart-peer",
    "dummy-asic",
    "embassy-net-afpacket",
    "embedded-i2c-unix",
    "embedded-serial-unix",
    "esp32s3-tsens",
    "eth-examples-host",
    "mining-protocol",
    "mmm",
    "rp235x-sha256",
    "serial-baudrate",
    "stratum-client",
    "stratum-v1",
    "stratum-v2",
    "ubos-logging",
    "ubos-monitor",
    "ubos-psu",
    "ubos-temperature",
    "host-runner",
]

[workspace.dependencies]
eth-examples      = { path = ".", default-features = false }
embassy-executor  = { version = "0.10.0", default-features = false }
embassy-sync      = { version = "0.8", default-features = false }
embassy-time      = { version = "0.5.1", default-features = false }
embassy-net       = { version = "0.9.0", default-features = false }
embassy-net-wiznet = { version = "0.3.0", default-features = false }
edge-mdns         = { git = "https://github.com/sysgrok/edge-net", rev = "1f084b41944c35b233cbe17accfbc09a56d5eaf0", default-features = false }
edge-nal          = { git = "https://github.com/sysgrok/edge-net", rev = "1f084b41944c35b233cbe17accfbc09a56d5eaf0", default-features = false }
edge-nal-embassy  = { git = "https://github.com/sysgrok/edge-net", rev = "1f084b41944c35b233cbe17accfbc09a56d5eaf0", default-features = false }
embassy-futures   = "0.1.2"
heapless          = "0.8"
defmt             = "1.0.1"
defmt-rtt         = "1.0.0"
panic-probe       = { version = "1.0.0", default-features = false }
static_cell       = "2.1"
portable-atomic   = { version = "1.13", features = ["critical-section"] }
embedded-hal      = "1.0"
embedded-hal-async = "1.0"
embedded-hal-bus  = { version = "0.1", default-features = false }
embedded-io-async = "0.7"
embedded-tls      = { version = "0.18", default-features = false }
rand_core         = { version = "0.6", default-features = false }
# Used by firmware crates whose hardware RNG is a single-owner
# peripheral (stm32f407, stm32f439) to give the stratum-v2 noise
# handshake an entropy source independent of the bitcoin-price TLS
# task. Seeded once at boot from the hardware RNG.
rand_chacha       = { version = "0.3", default-features = false }
embedded-graphics = { version = "0.8", default-features = false }
profont           = { version = "0.7.0", default-features = false }
format_no_std     = "1.2.0"
nb                = "1"
sha2              = { version = "0.10", default-features = false }
esp32s3-tsens     = { path = "esp32s3-tsens" }
asic-cpu-mock     = { path = "asic-cpu-mock" }
asic-uart-peer    = { path = "asic-uart-peer" }
mining-protocol   = { path = "mining-protocol" }
serial-baudrate   = { path = "serial-baudrate" }
stratum-client    = { path = "stratum-client" }
stratum-v1        = { path = "stratum-v1" }
stratum-v2        = { path = "stratum-v2" }
mmm               = { path = "mmm", default-features = false }
ii-sv2            = { git = "ssh://git@gitlab.ii.zone/braiins-forge/mining/usv2.git", tag = "v0.2.0", default-features = false }
ubos-logging      = { path = "ubos-logging", default-features = false }
ubos-monitor      = { path = "ubos-monitor", default-features = false }
ubos-psu          = { path = "ubos-psu", default-features = false }
ubos-temperature  = { path = "ubos-temperature", default-features = false }

[workspace.lints.clippy]
pedantic     = { level = "warn", priority = -1 }
unwrap_used  = "deny"

[lints]
workspace = true

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
incremental   = false
lto           = "fat"
opt-level     = "s"

# The dummy-asic mining loop is a tight hot path where speed matters
# more than image size. Override just this crate to opt-level 3.
[profile.release.package.dummy-asic]
opt-level = 3

# Vendored copy of embassy-net-wiznet 0.3.0 with the read_frame underflow
# fix from upstream commit 14592448 applied on top. Single-crate patch
# keeps every transitive embassy dep on crates.io. Patching embassy-time
# to a git rev silently swaps crate content while keeping the 0.5.1
# version string, which diverges from what embassy-rp 0.10.0 from
# crates.io was built against and hangs RP2040 at startup. See
# embassy-rs/embassy#1389 and #4500 for the class of failure.
[patch.crates-io]
embassy-net-wiznet = { path = "firmware/embassy-net-wiznet-patch" }

[profile.rust-analyzer]
inherits = "dev"
