[workspace]
resolver = "2"
members = [
    "firmware/bmm-pico",
    "firmware/rp2040",
    "firmware/rp2040-bootloader",
    "firmware/rp2350",
    "firmware/rp2350-bootloader",
    "firmware/hashnode",
    "firmware/stm32f407",
    "firmware/stm32f439",
    "firmware/esp32s3",
    "host/embassy-net-afpacket",
    "host/embedded-i2c-unix",
    "host/embedded-serial-unix",
    "host/host-runner",
    "host/ubos-main-host",
    "ubos-snapshot",
    "ubos/esp32s3-tsens",
    "ubos/mining-protocol",
    "ubos/ubos-asic",
    "ubos/ubos-mining",
    "ubos/rp235x-sha256",
    "ubos/serial-baudrate",
    "ubos/stratum-client",
    "ubos/stratum-v1",
    "ubos/stratum-v2",
    "ubos/ubos-api",
    "ubos/ubos-auth",
    "ubos/ubos-mdns",
    "ubos/ubos-core",
    "ubos/ubos-display",
    "ubos/ubos-http",
    "ubos/ubos-logging",
    "ubos/ubos-machine",
    "ubos/ubos-manager",
    "ubos/ubos-metrics",
    "ubos/ubos-cooling",
    "ubos/ubos-thermal",
    "ubos/ubos-config",
    "ubos/ubos-eeprom",
    "ubos/ubos-events",
    "ubos/ubos-firmware",
    "ubos/ubos-net",
    "ubos/ubos-ota",
    "ubos/ubos-psu",
    "ubos/ubos-temperature",
    "ubos/ubos-webui",
]

# micro-sv2 is its own nested workspace, vendored for deployment convenience
# and consumed only through the `ii-sv2` path dependency below. Without this
# exclude, cargo would auto-add it and its path-dep siblings as members of this
# workspace (path deps inside the workspace dir are pulled in), and their
# `workspace = true` inheritance would resolve against this root instead of
# micro-sv2's, which does not define their deps (bs58, secp256k1, ...).
exclude = ["micro-sv2"]

[workspace.package]
license = "GPL-3.0-or-later"
version = "0.0.1"
edition = "2024"

[workspace.metadata.crane]
name = "ubos-main"

[workspace.dependencies]
embassy-executor  = { version = "0.10.0", default-features = false }
embassy-sync      = { version = "0.8", default-features = false }
embassy-time      = { version = "0.5.1", default-features = false }
embassy-net       = { version = "0.9.0", default-features = false }
embassy-net-wiznet = { version = "0.3.0", default-features = false }
edge-http         = { git = "https://github.com/ivmarkov/edge-net", rev = "1f084b41944c35b233cbe17accfbc09a56d5eaf0", default-features = false }
edge-mdns         = { git = "https://github.com/ivmarkov/edge-net", rev = "1f084b41944c35b233cbe17accfbc09a56d5eaf0", default-features = false }
edge-nal          = { git = "https://github.com/ivmarkov/edge-net", rev = "1f084b41944c35b233cbe17accfbc09a56d5eaf0", default-features = false }
edge-nal-embassy  = { git = "https://github.com/ivmarkov/edge-net", rev = "1f084b41944c35b233cbe17accfbc09a56d5eaf0", default-features = false }
embassy-futures   = "0.1.2"
heapless          = "0.9"
libm              = "0.2"
defmt             = "1.0.1"
defmt-rtt         = "1.0.0"
panic-probe       = { version = "1.0.0", default-features = false }
static_cell       = "2.1"
portable-atomic   = { version = "1.13", features = ["critical-section"] }
embedded-hal      = "1.0"
embedded-hal-async = "1.0"
embedded-hal-bus  = { version = "0.1", default-features = false }
embedded-io-async = "0.7"
# Async TCA9554 I/O-expander driver for the esp32s3 carrier's expander
# (EXIO4/EXIO5 drive the hashboard serial path).
tca9554           = "0.1.1"
rand_core         = { version = "0.6", default-features = false }
# Used by firmware crates whose hardware RNG is a single-owner
# peripheral (stm32f407, stm32f439) to give the stratum-v2 noise
# handshake an entropy source independent of the session CSPRNG.
# Seeded once at boot from the hardware RNG.
rand_chacha       = { version = "0.3", default-features = false }
embedded-graphics = { version = "0.8", default-features = false }
profont           = { version = "0.7.0", default-features = false }
format_no_std     = "1.2.0"
nb                = "1"
sha2              = { version = "0.10", default-features = false }
crc               = { version = "3", default-features = false }
bitfield-struct   = "0.13"
zerocopy          = { version = "0.8", default-features = false, features = ["derive"] }
serde             = { version = "1", default-features = false, features = ["derive"] }
serde-json-core   = "0.6"
postcard               = { version = "1.1", default-features = false, features = ["heapless"] }
postcard-schema        = { version = "0.2", default-features = false, features = ["derive", "heapless-v0_9"] }
sequential-storage     = { version = "7.0", default-features = false }
embedded-storage       = { version = "0.3", default-features = false }
embedded-storage-async = { version = "0.4", default-features = false }
esp32s3-tsens     = { path = "ubos/esp32s3-tsens" }
mining-protocol   = { path = "ubos/mining-protocol" }
serial-baudrate   = { path = "ubos/serial-baudrate" }
stratum-client    = { path = "ubos/stratum-client" }
stratum-v1        = { path = "ubos/stratum-v1" }
stratum-v2        = { path = "ubos/stratum-v2" }
ubos-mining       = { path = "ubos/ubos-mining", default-features = false }
ii-sv2            = { path = "micro-sv2/ii-sv2", default-features = false }
ubos-api          = { path = "ubos/ubos-api", default-features = false }
ubos-asic         = { path = "ubos/ubos-asic" }
ubos-auth         = { path = "ubos/ubos-auth", default-features = false }
ubos-core         = { path = "ubos/ubos-core" }
ubos-display      = { path = "ubos/ubos-display" }
ubos-http         = { path = "ubos/ubos-http", default-features = false }
ubos-logging      = { path = "ubos/ubos-logging", default-features = false }
ubos-manager      = { path = "ubos/ubos-manager", default-features = false }
ubos-machine      = { path = "ubos/ubos-machine" }
ubos-metrics      = { path = "ubos/ubos-metrics", default-features = false }
ubos-cooling      = { path = "ubos/ubos-cooling", default-features = false }
ubos-thermal      = { path = "ubos/ubos-thermal", default-features = false }
ubos-config       = { path = "ubos/ubos-config", default-features = false }
ubos-eeprom       = { path = "ubos/ubos-eeprom", default-features = false }
ubos-events       = { path = "ubos/ubos-events", default-features = false }
ubos-firmware     = { path = "ubos/ubos-firmware", default-features = false }
ubos-mdns         = { path = "ubos/ubos-mdns", default-features = false }
ubos-net          = { path = "ubos/ubos-net", default-features = false }
ubos-ota          = { path = "ubos/ubos-ota", default-features = false }
ubos-psu          = { path = "ubos/ubos-psu", default-features = false }
ubos-temperature  = { path = "ubos/ubos-temperature", default-features = false }
ubos-webui        = { path = "ubos/ubos-webui", default-features = false }

[workspace.lints.clippy]
pedantic     = { level = "warn", priority = -1 }
unwrap_used  = "deny"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
incremental   = false
lto           = "fat"
opt-level     = "s"

# embassy-net-wiznet 0.3.0 from crates.io with the read_frame underflow
# fix from upstream commit 14592448 applied on top, plus a local rework
# that drains every buffered RX frame per RECV interrupt instead of one.
# The repo carries only the patch files; nix materializes the patched
# tree at this path — the dev shells symlink it into the working tree
# and nix/source.nix copies it into the check sources (see
# nix/patched-crates.nix) — so cargo must run inside the dev shells.
# Single-crate patch keeps every transitive embassy dep on crates.io.
# Patching embassy-time to a git rev silently swaps crate content while
# keeping the 0.5.1 version string, which diverges from what embassy-rp
# 0.10.0 from crates.io was built against and hangs RP2040 at startup.
# See embassy-rs/embassy#1389 and #4500 for the class of failure.
[patch.crates-io]
embassy-net-wiznet = { path = "patches/embassy-net-wiznet" }

# edge-nal-embassy from the pinned edge-net rev with the local patch
# series applied on top; nix materializes the tree at this path the
# same way as embassy-net-wiznet above. Each patch file's preamble
# explains its fix; the peer-endpoint fix has an upstream PR pending.
[patch."https://github.com/ivmarkov/edge-net"]
edge-nal-embassy = { path = "patches/edge-nal-embassy" }

[profile.rust-analyzer]
inherits = "dev"
