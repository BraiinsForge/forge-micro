# Stage 1: commit-message and formatting gates. Both are cheap and
# need no compiled dependencies, so they fail fast - a style or commit
# slip is reported in seconds, before any crate is built.

commits:
  stage: lint
  variables:
    GIT_DEPTH: 0
  script:
    - test -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" || { echo "CI_MERGE_REQUEST_DIFF_BASE_SHA is empty"; exit 1; }
    - nix shell nixpkgs#gitlint --command gitlint --commits "$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# nixfmt over every .nix file plus `cargo fmt --check` over the
# workspace. `.#ci-format` is a flake package that link-farms exactly
# the `fmt`, `nixfmt`, and vendored micro-sv2 formatting checks, so
# this is the same build a developer runs locally.
# Runs on every MR (it is fast and touches no dependency graph).
format:
  stage: lint
  script:
    - nix build --no-link --print-build-logs .#ci-format
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
