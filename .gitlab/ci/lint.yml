# Stage 1: commit-message and formatting gates. Both are cheap and
# need no compiled dependencies, so they fail fast - a style or commit
# slip is reported in seconds, before any crate is built.

commits:
  stage: lint
  variables:
    GIT_DEPTH: 0
  script:
    - test -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" || { echo "CI_MERGE_REQUEST_DIFF_BASE_SHA is empty"; exit 1; }
    - nix shell --inputs-from . nixpkgs#gitlint --command gitlint --commits "$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# nixfmt over every .nix file plus `cargo fmt --check` over the
# workspace. `.#ci-format` is a flake package that link-farms exactly
# the `fmt`, `nixfmt`, and vendored micro-sv2 formatting checks, so
# this is the same build a developer runs locally.
# Runs on every MR (it is fast and touches no dependency graph).
format:
  stage: lint
  script:
    - nix build --no-link --print-build-logs --option allow-unsafe-native-code-during-evaluation true .#ci-format
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# The two gates that read instruction files: `claude-md-limit` on the
# line budget and `instruction-paths` on every backticked path they
# name. Both are `runCommand` text gates that build in seconds, so they
# run on every MR with no `changes:` filter, the way `format` does.
#
# They are in `.#ci-check` as well, and that is deliberate: the union
# of the three groups stays exactly `nix flake check`, and this job
# rebuilds two derivations the check stage would otherwise reach only
# when a Rust or Nix path changed. `instruction-paths` fails on a
# *referenced* path disappearing rather than on the file that names it
# changing, so no list of changed paths selects it correctly; running
# it always is cheaper than maintaining that list and being wrong.
instructions:
  stage: lint
  script:
    - nix build --no-link --print-build-logs --option allow-unsafe-native-code-during-evaluation true
      .#checks.x86_64-linux.claude-md-limit
      .#checks.x86_64-linux.instruction-paths
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
