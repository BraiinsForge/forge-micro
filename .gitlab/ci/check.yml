# Stages 2 and 3: the Rust gates. Each builds a slice of the flake's
# checks via the `.#ci-clippy` / `.#ci-check` flake packages, so each is
# reproducible locally and the union of `ci-format` + `ci-clippy` +
# `ci-check` is exactly `nix flake check` - no derivation is built twice
# across the stages. Clippy and the build/test of a crate are distinct
# derivations, so a changed crate's sources do compile once per stage
# (clippy, then build); that is the cost of failing lint before the
# expensive stage, not a redundant rebuild of the same derivation.

# Run the staged flake checks on the default branch for full coverage
# at merge, and on an MR only when a change can affect one of them: the
# Rust sources, manifests, lockfile, cargo config, linker scripts,
# build scripts, embedded assets, and test fixtures the clippy and
# check builds consume, plus any Nix file, since every check derivation
# is defined in one. A docs-only MR skips them. A Nix-only MR also
# triggers clippy, which ignores those inputs, so that job resolves to
# cache hits.
.rust-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.rs"
        - "**/Cargo.toml"
        - "Cargo.lock"
        - "**/.cargo/config.toml"
        - "**/*.x"
        - "**/build.rs"
        - "**/*.html"
        - "**/*.css"
        - "**/*.js"
        - "**/*.svg"
        - "**/tests/fixtures/**"
        - "patches/**"
        - "**/*.nix"
        - "flake.lock"

# Stage 2: per-crate clippy/check (clippy-* checks, `-D warnings`).
# Fails before the expensive build/test stage so a lint slip on the
# changed crate surfaces early. On a warm store unchanged crates are
# cache hits.
clippy:
  stage: clippy
  extends:
    - .rust-rules
  script:
    - nix build --no-link --print-build-logs --option allow-unsafe-native-code-during-evaluation true .#ci-clippy

# Stage 3: everything else `nix flake check` covers - host tests,
# firmware release builds with their flash-size and pool-worker guards,
# cargo-machete, and the OTA image-limit guard. This is the
# comprehensive backstop; clippy already passed.
check:
  stage: check
  extends:
    - .rust-rules
  script:
    - nix build --no-link --print-build-logs --option allow-unsafe-native-code-during-evaluation true .#ci-check

# Flashable hashnode and forge-axe BOOTSEL images for every commit
# that lands on the default branch. The `nix run` app copies the UF2
# out of the store into build/, so the artifact archives the file
# itself rather than a dangling /nix/store symlink. The archive name
# carries the commit; the pure build inside is always version 1.
.uf2-image:
  stage: check
  artifacts:
    paths:
      - build/*.uf2
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

hashnode-uf2:
  extends:
    - .uf2-image
  script:
    - nix run --print-build-logs --option allow-unsafe-native-code-during-evaluation true .#hashnode-uf2
  artifacts:
    name: "hashnode-uf2-${CI_COMMIT_SHORT_SHA}"

forge-axe-uf2:
  extends:
    - .uf2-image
  script:
    - nix run --print-build-logs --option allow-unsafe-native-code-during-evaluation true .#forge-axe-uf2
  artifacts:
    name: "forge-axe-uf2-${CI_COMMIT_SHORT_SHA}"
