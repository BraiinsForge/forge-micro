[target.thumbv8m.main-none-eabihf]
runner = [
  "probe-rs-runner", "run",
  "--chip", "RP235x",
  "--log-format", "{t:>10} {f:<14} [{L}] {s}",
]

# POOL_USER overrides the workspace .cargo/config.toml default and seeds
# Config::default() at compile time; a persisted config in flash supersedes
# it. Operating point, cooling profile, and chip baud all come from the
# board descriptor and config defaults, not build-time env.
[env]
# The brand this board ships; brand/README.md holds the table and the format.
UBOS_BRAND = { value = "../../brand/forge", relative = true }
DEFMT_LOG = "info,embassy_net=info,smoltcp=info"
# A dev-flash worker for the test pool, and the one name the board's
# rename did not move: it is an operator-facing identity on a pool
# account, so changing it is a decision for whoever owns that account
# rather than a substitution. No shipped image carries it, which
# nix/guards.nix proves by grepping every image for the string.
POOL_USER = "braiinstest.axe"

[build]
target = "thumbv8m.main-none-eabihf"
