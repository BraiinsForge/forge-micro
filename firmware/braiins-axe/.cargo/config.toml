[target.thumbv8m.main-none-eabihf]
runner = [
  "probe-rs-runner", "run",
  "--chip", "RP235x",
  "--log-format", "{t:>10} {f:<14} [{L}] {s}",
]

# POOL_USER overrides the workspace .cargo/config.toml default and seeds
# Config::default() at compile time; a persisted config in flash supersedes
# it. Operating point, cooling profile, and chip baud all come from the
# board descriptor and config defaults, not build-time env.
[env]
DEFMT_LOG = "info,embassy_net=info,smoltcp=info"
POOL_USER = "braiinstest.axe"

[build]
target = "thumbv8m.main-none-eabihf"
