[package]
license.workspace = true
edition.workspace = true
name    = "esp32s3"
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["display"]
display = []

[dependencies]
ubos-http            = { workspace = true, features = ["defmt"] }
ubos-api             = { workspace = true, features = ["defmt"] }
ubos-webui           = { workspace = true, features = ["defmt"] }
ubos-auth            = { workspace = true, features = ["defmt"] }
ubos-metrics         = { workspace = true, features = ["defmt"] }
ubos-mdns            = { workspace = true, features = ["defmt"] }
ubos-net             = { workspace = true, features = ["defmt"] }
ubos-events          = { workspace = true, features = ["defmt"] }
ubos-firmware        = { workspace = true, features = ["defmt"] }
ubos-display         = { workspace = true }
ubos-core            = { workspace = true }
ubos-machine         = { workspace = true }
esp32s3-tsens          = { workspace = true }
embassy-executor       = { workspace = true, features = ["defmt"] }
embassy-time           = { workspace = true, features = ["defmt", "generic-queue-8"] }
embassy-net            = { workspace = true, features = ["defmt", "tcp", "udp", "dns", "dhcpv4", "medium-ethernet"] }
embassy-net-wiznet     = { workspace = true, features = ["defmt"] }
defmt                  = { workspace = true }
portable-atomic        = { workspace = true }
static_cell            = { workspace = true }
embedded-hal-bus       = { workspace = true, features = ["async"] }
ubos-thermal           = { workspace = true, features = ["defmt"] }
ubos-manager           = { workspace = true, features = ["defmt"] }
ubos-config            = { workspace = true, features = ["defmt"] }
ubos-asic              = { workspace = true }
ubos-eeprom            = { workspace = true, features = ["defmt"] }
ubos-cooling           = { workspace = true, features = ["defmt"] }
ubos-psu               = { workspace = true, features = ["defmt"] }
ubos-mining            = { workspace = true, features = ["defmt"] }
ubos-ota               = { workspace = true, features = ["defmt", "esp"] }
serial-baudrate        = { workspace = true }
embassy-embedded-hal   = { version = "0.6.0", default-features = false, features = ["defmt"] }
embassy-sync           = { workspace = true, features = ["defmt"] }
embedded-io-async      = { workspace = true }
critical-section       = { version = "1" }
esp-hal                = { version = "1.1.1", features = ["defmt", "esp32s3", "unstable"] }
esp-rtos               = { version = "0.3.0", features = ["embassy", "esp32s3", "defmt"] }
esp-backtrace          = { version = "0.19.0", features = ["defmt", "esp32s3", "panic-handler"] }
rand_core              = { workspace = true }
defmt-rtt              = "1.1.0"
# default-features = false drops the `validation` feature. It is on by
# default and, through feature unification, would re-enable the partition-table
# MD5 check that `ubos-ota` deliberately disables: the crate's check rejects our
# otherwise-valid table, so `OtaUpdater::new` returns `Invalid` and the OTA
# parse fails at boot. The second-stage bootloader already MD5-validates the
# table before booting, so the app re-validating it is redundant. Only
# `esp_app_desc!` is used from here, which does not need the feature.
esp-bootloader-esp-idf = { version = "0.5.0", default-features = false, features = ["esp32s3"] }
esp-storage            = { version = "0.9.0", default-features = false, features = ["esp32s3", "critical-section"] }
tca9554                = { workspace = true, features = ["defmt"] }

# critical-section is pulled in by esp-storage and esp-hal feature unification;
# rand_core is required by secp256k1 / ii-sv2 but not directly imported.
# Both are real transitive requirements that machete flags as unused.
[package.metadata.cargo-machete]
ignored = ["critical-section", "rand_core"]
