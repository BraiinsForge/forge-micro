[package]
edition = "2021"
name    = "esp32s3"
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["display", "backend-uart"]
display = []
backend-uart = ["dep:ubos-backend"]
# backend-cpu is mutually exclusive with backend-uart: enable with
# `--no-default-features --features "display,backend-cpu"`.
backend-cpu = ["dep:ubos-backend", "dep:cpu-miner"]
# New stack: stratum-client + asic-cpu-mock, behind the
# mining-protocol trait. Mutually exclusive with backend-cpu and
# backend-uart; enable with
# `--no-default-features --features "display,backend-stratum-client"`.
backend-stratum-client = [
    "dep:asic-cpu-mock",
    "dep:stratum-client",
    "dep:stratum-v1",
]

[dependencies]
eth-examples           = { workspace = true, features = ["defmt"] }
esp32s3-tsens          = { workspace = true }
embassy-executor       = { version = "0.9.1", features = ["defmt"] }
embassy-time           = { workspace = true, features = ["defmt", "generic-queue-8"] }
embassy-net            = { workspace = true, features = ["defmt", "tcp", "udp", "dns", "dhcpv4", "medium-ethernet"] }
embassy-net-wiznet     = { workspace = true, features = ["defmt"] }
defmt                  = { workspace = true }
portable-atomic        = { workspace = true }
static_cell            = { workspace = true }
embedded-hal-bus       = { workspace = true, features = ["async"] }
asic-cpu-mock          = { workspace = true, optional = true }
cpu-miner              = { workspace = true, optional = true }
stratum-client         = { workspace = true, optional = true }
stratum-v1             = { workspace = true, optional = true }
ubos-backend           = { path = "../../ubos-backend", optional = true }
esp-hal                = { version = "1.0.0", features = ["defmt", "esp32s3", "unstable"] }
esp-rtos               = { version = "0.2.0", features = ["embassy", "esp32s3", "defmt"] }
esp-backtrace          = { version = "0.18.1", features = ["defmt", "esp32s3", "panic-handler"] }
rand_core              = { workspace = true }
defmt-rtt              = "1.1.0"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }
