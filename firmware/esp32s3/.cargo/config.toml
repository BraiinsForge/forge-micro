[target.xtensa-esp32s3-none-elf]
runner = [
  "probe-rs-runner", "run",
  "--chip", "esp32s3",
  "--probe", "303a:1001:D8:3B:DA:49:F7:E0",
  "--log-format", "{t:>10} {f:<14} [{L}] {s}",
]

[env]
DEFMT_LOG = "debug,esp_hal=info,esp_rtos=info,embassy_net=info"

[build]
rustflags = [
  "-C", "link-arg=-Tlinkall.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=-nostartfiles",
]
target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["core"]
