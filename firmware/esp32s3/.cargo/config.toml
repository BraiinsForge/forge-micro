[target.xtensa-esp32s3-none-elf]
runner = [
  "probe-rs-runner", "run",
  "--chip", "esp32s3",
  "--log-format", "{t:>10} {f:<14} [{L}] {s}",
]

[env]
# The brand this board ships; brand/README.md holds the table and the format.
UBOS_BRAND = { value = "../../brand/ubos", relative = true }
# This board ships no fee slot; docs/DEVFEE.md says how the line is read.
DEVFEE = "0"
# DEFMT_LOG stays per-firmware (see workspace .cargo/config.toml for
# why). The common default all boards share, plus silencers for the
# board-only esp-hal/esp-rtos crates, which chatter at debug. POOL_*
# defaults inherit from the workspace config.
DEFMT_LOG = "debug,embassy_net=info,smoltcp=info,esp_hal=info,esp_rtos=info"
# esp-rtos 0.3.0 adds per-CPU scheduler state that pushed the binary
# over dram_seg. Moving interrupt switch tables back to flash recovers
# enough room without affecting mining throughput.
ESP_HAL_CONFIG_PLACE_SWITCH_TABLES_IN_RAM = { value = "false", force = true }

[build]
rustflags = [
  "-C", "link-arg=-Tlinkall.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=-nostartfiles",
]
target = "xtensa-esp32s3-none-elf"

# `cargo run` flashes over the board's builtin USB-JTAG and auto-selects
# when only one probe is plugged in. Export $PROBE_SERIAL to pin a
# specific probe when several are.

[unstable]
build-std = ["core"]
