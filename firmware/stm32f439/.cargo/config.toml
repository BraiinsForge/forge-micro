[target.thumbv7em-none-eabihf]
runner = [
  "probe-rs-runner", "run",
  "--chip", "STM32F439ZITx",
  "--connect-under-reset",
  "--log-format", "{t:>10} {f:<14} [{L}] {s}",
]

# POOL_* defaults live in the workspace .cargo/config.toml.
[env]
# The brand this board ships; brand/README.md holds the table and the format.
UBOS_BRAND = { value = "../../brand/ubos", relative = true }
# This board ships no fee slot; docs/DEVFEE.md says how the line is read.
DEVFEE = "0"
DEFMT_LOG = "debug,embassy_net=info,smoltcp=info"

[build]
target = "thumbv7em-none-eabihf"

# `cargo run` flashes over a probe attached to this machine and
# auto-selects when only one probe is plugged in. Export $PROBE_SERIAL to
# pin a specific probe when several are.
