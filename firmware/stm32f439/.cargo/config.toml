[target.thumbv7em-none-eabihf]
runner = [
  "probe-rs-runner", "run",
  "--chip", "STM32F439ZITx",
  "--connect-under-reset",
  "--log-format", "{t:>10} {f:<14} [{L}] {s}",
]

# POOL_* defaults live in the workspace .cargo/config.toml.
[env]
DEFMT_LOG = "debug,embassy_net=info,smoltcp=info"

[build]
target = "thumbv7em-none-eabihf"

# Per-board alias in the bmm-pico run-N style: the bench board is slot 1
# of this family and its onboard ST-LINK is pinned by serial, so a probe
# host carrying several probes cannot hand out a stranger. Bare
# `cargo run` auto-selects and needs a single attached probe.
[alias]
run-1 = ["run", "--config", "env.PROBE_SERIAL=\"0483:374b:0671FF515776525067255149\""]
