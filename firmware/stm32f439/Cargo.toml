[package]
edition = "2021"
name    = "stm32f439"
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["cpu-mining"]
display = []
dummy-asic = []
cpu-mining = ["dep:ubos-backend"]

[dependencies]
eth-examples        = { workspace = true }
embassy-executor    = { workspace = true, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time        = { workspace = true, features = ["defmt"] }
embassy-net         = { workspace = true, features = ["defmt", "tcp", "udp", "dns", "dhcpv4", "medium-ethernet"] }
embassy-stm32       = { version = "0.6.0", features = ["defmt", "stm32f439zi", "memory-x", "time-driver-tim2", "time"] }
defmt               = { workspace = true }
defmt-rtt           = { workspace = true }
panic-probe         = { workspace = true, features = ["print-defmt"] }
static_cell         = { workspace = true }
embedded-hal-bus    = { workspace = true, features = ["async"] }
cortex-m            = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt         = "0.7"
heapless            = { workspace = true }
portable-atomic     = { workspace = true }
ubos-backend        = { path = "../../ubos-backend", optional = true }

# cortex-m is pulled in for the `critical-section-single-core`
# feature; no direct source references, so machete cannot see it.
[package.metadata.cargo-machete]
ignored = ["cortex-m"]
