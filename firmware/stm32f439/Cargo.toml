[package]
edition = "2021"
name    = "stm32f439"
version = "0.1.0"

[lints]
workspace = true

[features]
default = []
display = []
# UART peer backend: drives an external dummy-asic board over UART.
# Mutually exclusive with `backend-cpu`.
backend-uart = [
    "dep:asic-uart-peer",
    "dep:stratum-client",
    "dep:stratum-v1",
    "asic-uart-peer/defmt",
    "stratum-client/defmt",
    "stratum-v1/defmt",
]
# CPU mock backend: hashes on-MCU instead of driving a peer.
# Mutually exclusive with `backend-uart`; enable with
# `--no-default-features --features "backend-cpu"`.
backend-cpu = [
    "dep:asic-cpu-mock",
    "dep:stratum-client",
    "dep:stratum-v1",
    "asic-cpu-mock/defmt",
    "stratum-client/defmt",
    "stratum-v1/defmt",
]
# Adds the StratumV2 adapter to the build. Only meaningful with a
# backend selected; pulls in `secp256k1/lowmemory` via the ii-sv2
# chain. `rand_chacha` provides a ChaCha20 PRNG seeded once at boot
# from the hardware RNG, since the stm32 RNG peripheral has a
# single owner and the bitcoin-price task already claims it. Not
# in default features: stm32f439 ships backend-less so the
# dummy-asic peer can attach separately; an explicit
# `--features "backend-<uart|cpu>,stratum2"` enables both halves.
stratum2 = [
    "dep:stratum-v2",
    "dep:ii-sv2",
    "dep:rand_chacha",
    "ii-sv2/lowmemory",
    "stratum-v2/defmt",
]

[dependencies]
eth-examples        = { workspace = true, features = ["defmt"] }
embassy-executor    = { workspace = true, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time        = { workspace = true, features = ["defmt"] }
embassy-net         = { workspace = true, features = ["defmt", "tcp", "udp", "dns", "dhcpv4", "medium-ethernet"] }
embassy-stm32       = { version = "0.6.0", features = ["defmt", "stm32f439zi", "memory-x", "time-driver-tim2", "time"] }
defmt               = { workspace = true }
defmt-rtt           = { workspace = true }
panic-probe         = { workspace = true, features = ["print-defmt"] }
static_cell         = { workspace = true }
embedded-hal-bus    = { workspace = true, features = ["async"] }
cortex-m            = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt         = "0.7"
portable-atomic     = { workspace = true }
asic-cpu-mock       = { workspace = true, optional = true }
asic-uart-peer      = { workspace = true, optional = true }
stratum-client      = { workspace = true, optional = true }
stratum-v1          = { workspace = true, optional = true }
stratum-v2          = { workspace = true, features = ["defmt"] }
# Workspace dep is declared with default-features = false so the
# firmware does not pull `alloc` via secp256k1's alloc feature.
ii-sv2              = { workspace = true, features = ["lowmemory"] }
rand_chacha         = { workspace = true }
ubos-temperature    = { workspace = true, features = ["defmt"] }

# cortex-m is pulled in for the `critical-section-single-core`
# feature; no direct source references, so machete cannot see it.
[package.metadata.cargo-machete]
ignored = ["cortex-m"]
