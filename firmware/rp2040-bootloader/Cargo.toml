[package]
license.workspace = true
name    = "rp2040-bootloader"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[dependencies]
embassy-boot-rp    = { version = "0.10.0" }
# rp2040 feature, not rp235xa, so embassy-rp embeds boot2 via its
# `select_bootloader!` macro and link-rp.x places it at ORIGIN(BOOT2).
embassy-rp         = { version = "0.10.0", features = ["rp2040"] }
embassy-sync       = { version = "0.8", default-features = false }
embassy-time       = { version = "0.5.1", default-features = false }
# critical-section-single-core avoids the embassy-rp/critical-section-impl
# feature that would conflict with the main firmware's feature unification
# when both are in the same buildDepsOnly bag.
cortex-m           = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt        = "0.7"
defmt              = { workspace = true, optional = true }
defmt-rtt          = { workspace = true, optional = true }

[build-dependencies]
ubos-build = { workspace = true }

[features]
default = []
defmt   = [
    "dep:defmt",
    "dep:defmt-rtt",
    "embassy-boot-rp/defmt",
    "embassy-rp/defmt",
]

# defmt is an optional dep gated behind the defmt feature flag; machete
# does not follow feature-gated paths.
[package.metadata.cargo-machete]
ignored = ["defmt"]
