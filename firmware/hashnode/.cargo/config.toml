[target.thumbv8m.main-none-eabihf]
runner = [
  "probe-rs-runner", "run",
  "--chip", "RP235x",
  "--log-format", "{t:>10} {f:<14} [{L}] {s}",
]

# POOL_* defaults live in the workspace .cargo/config.toml. Operating
# point, cooling profile, and chip baud all come from the board descriptor
# and config defaults now, not build-time env.
[env]
# The brand this board ships; brand/README.md holds the table and the format.
UBOS_BRAND = { value = "../../brand/forge", relative = true }
# This board ships no fee slot; docs/DEVFEE.md says how the line is read.
DEVFEE = "0"
DEFMT_LOG = "debug,embassy_net=info,smoltcp=info,edge_http=info"

[build]
target = "thumbv8m.main-none-eabihf"
