[package]
publish.workspace = true
name    = "rp2350-bootloader"
license.workspace = true
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[dependencies]
rp-bootloader = { workspace = true }
embassy-rp    = { version = "0.10.0", features = ["rp235xa"] }
cortex-m-rt   = "0.7"

[build-dependencies]
ubos-build = { workspace = true }

[features]
default = []
defmt   = [
    "rp-bootloader/defmt",
    "embassy-rp/defmt",
]

# embassy-rp is named only to select the chip feature the shared boot
# sequence compiles against; the source imports nothing from it, so
# machete would report it unused.
[package.metadata.cargo-machete]
ignored = ["embassy-rp"]
