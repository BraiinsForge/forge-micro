[package]
name    = "rp2350-bootloader"
edition = "2021"
version = "0.1.0"

[lints]
workspace = true

[dependencies]
embassy-boot-rp    = { version = "0.10.0" }
embassy-rp         = { version = "0.10.0", features = ["rp235xa"] }
embassy-sync       = { version = "0.8", default-features = false }
embassy-time       = { version = "0.5.1", default-features = false }
cortex-m           = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt        = "0.7"
defmt              = { workspace = true, optional = true }
defmt-rtt          = { workspace = true, optional = true }

[features]
default = []
defmt   = [
    "dep:defmt",
    "dep:defmt-rtt",
    "embassy-boot-rp/defmt",
    "embassy-rp/defmt",
]

# defmt is an optional dep gated behind the defmt feature flag; machete
# does not follow feature-gated paths.
[package.metadata.cargo-machete]
ignored = ["defmt"]
