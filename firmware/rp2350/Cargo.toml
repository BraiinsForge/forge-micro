[package]
edition = "2021"
name    = "rp2350"
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["display", "backend-uart"]
display = []
# UART peer backend: drives an external dummy-asic board over UART.
# Always links Stratum V1; layer `stratum2` on top to also link the
# V2 adapter. Mutually exclusive with `backend-cpu`.
backend-uart = [
    "dep:asic-uart-peer",
    "dep:stratum-client",
    "dep:stratum-v1",
    "asic-uart-peer/defmt",
    "stratum-client/defmt",
    "stratum-v1/defmt",
]
# CPU mock backend: hashes on-MCU instead of driving a peer.
# Mutually exclusive with `backend-uart`; enable with
# `--no-default-features --features "display,backend-cpu"`.
backend-cpu = [
    "dep:asic-cpu-mock",
    "dep:stratum-client",
    "dep:stratum-v1",
    "asic-cpu-mock/defmt",
    "stratum-client/defmt",
    "stratum-v1/defmt",
]
# Adds the StratumV2 adapter to the build. Layers on top of either
# backend (does not stand alone). Pulls in `secp256k1/lowmemory`
# via the ii-sv2 chain so the verification context fits in RP2350
# SRAM. When enabled and `POOL_PROTOCOL=sv2`, the stratum task
# constructs `StratumV2Client`; when disabled, any
# `POOL_PROTOCOL=sv2` setting falls back to V1 with a defmt warning.
stratum2 = [
    "dep:stratum-v2",
    "dep:ii-sv2",
    "dep:rand_core",
    "ii-sv2/lowmemory",
    "stratum-v2/defmt",
]

[dependencies]
eth-examples        = { workspace = true, features = ["defmt"] }
embassy-executor    = { workspace = true, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-net         = { workspace = true, features = ["defmt", "tcp", "udp", "dhcpv4", "medium-ethernet", "dns"] }
embassy-net-wiznet  = { workspace = true, features = ["defmt"] }
embassy-rp          = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa"] }
embassy-time        = { workspace = true, features = ["defmt"] }
embedded-io-async   = { workspace = true }
defmt               = { workspace = true }
defmt-rtt           = { workspace = true }
panic-probe         = { workspace = true, features = ["print-defmt"] }
static_cell         = { workspace = true }
embedded-hal-bus    = { workspace = true, features = ["async"] }
portable-atomic     = { workspace = true }
cortex-m            = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt         = "0.7"
asic-cpu-mock       = { workspace = true, optional = true }
asic-uart-peer      = { workspace = true, optional = true }
stratum-client      = { workspace = true, optional = true }
stratum-v1          = { workspace = true, optional = true }
stratum-v2          = { workspace = true, optional = true }
# Workspace dep is declared with default-features = false so the
# firmware does not pull `alloc` via secp256k1's alloc feature.
ii-sv2              = { workspace = true, optional = true }
# rand_core 0.6 is only needed when stratum2 brings in the V2
# adapter; RoscRng's inherent `next_u64` covers the existing seed
# path. Pulled via the workspace dep so versions stay aligned.
rand_core           = { workspace = true, optional = true }

# cortex-m is pulled in for the `inline-asm` feature; no direct
# source references, so machete cannot see it.
[package.metadata.cargo-machete]
ignored = ["cortex-m"]
