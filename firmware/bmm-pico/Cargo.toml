[package]
edition = "2021"
name    = "bmm-pico"
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["display"]
display = []
backend-uart = ["dep:ubos-backend"]
# backend-cpu is mutually exclusive with backend-uart: enable with
# `--no-default-features --features "display,backend-cpu"`.
backend-cpu = ["dep:ubos-backend", "dep:cpu-miner"]

[dependencies]
eth-examples        = { workspace = true }
embassy-executor    = { workspace = true, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-net         = { workspace = true, features = ["defmt", "tcp", "udp", "dhcpv4", "medium-ethernet", "dns"] }
embassy-net-wiznet  = { workspace = true, features = ["defmt"] }
embassy-rp          = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa"] }
embassy-time        = { workspace = true, features = ["defmt"] }
defmt               = { workspace = true }
defmt-rtt           = { workspace = true }
panic-probe         = { workspace = true, features = ["print-defmt"] }
static_cell         = { workspace = true }
embedded-hal-bus    = { workspace = true, features = ["async"] }
embedded-io-async   = { workspace = true }
portable-atomic     = { workspace = true }
cortex-m            = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt         = "0.7"
cpu-miner           = { workspace = true, optional = true }
ubos-backend        = { path = "../../ubos-backend", optional = true }

# cortex-m and cortex-m-rt are pulled in by `#[embassy_executor::main]` and
# the linker scripts; no direct source references, so machete can't see them.
[package.metadata.cargo-machete]
ignored = ["cortex-m", "cortex-m-rt"]
