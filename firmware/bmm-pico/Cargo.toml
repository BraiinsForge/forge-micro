[package]
edition = "2021"
name    = "bmm-pico"
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["display"]
display = []
# UART peer backend: drives an external dummy-asic board over UART.
# Mutually exclusive with `backend-cpu`.
backend-uart = [
    "dep:asic-uart-peer",
    "dep:stratum-client",
    "dep:stratum-v1",
    "asic-uart-peer/defmt",
    "stratum-client/defmt",
    "stratum-v1/defmt",
]
# CPU mock backend: hashes on-MCU instead of driving a peer.
# Mutually exclusive with `backend-uart`; enable with
# `--no-default-features --features "display,backend-cpu"`.
backend-cpu = [
    "dep:asic-cpu-mock",
    "dep:stratum-client",
    "dep:stratum-v1",
    "asic-cpu-mock/defmt",
    "stratum-client/defmt",
    "stratum-v1/defmt",
]
# MMM backend: drives a BMM100 hashboard directly over BM1362 chip serial
# on UART1, hashboard PSU on I2C1. Mutually exclusive with backend-uart
# and backend-cpu.
backend-mmm = [
    "dep:mmm",
    "dep:stratum-client",
    "dep:stratum-v1",
    "dep:ubos-psu",
    "dep:serial-baudrate",
    "dep:embassy-embedded-hal",
    "dep:embassy-sync",
    "mmm/defmt",
    "stratum-client/defmt",
    "stratum-v1/defmt",
]

[dependencies]
eth-examples         = { workspace = true, features = ["defmt"] }
embassy-executor     = { workspace = true, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-net          = { workspace = true, features = ["defmt", "tcp", "udp", "dhcpv4", "medium-ethernet", "dns"] }
embassy-net-wiznet   = { workspace = true, features = ["defmt"] }
embassy-rp           = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa"] }
embassy-time         = { workspace = true, features = ["defmt"] }
defmt                = { workspace = true }
defmt-rtt            = { workspace = true }
panic-probe          = { workspace = true, features = ["print-defmt"] }
static_cell          = { workspace = true }
heapless             = { workspace = true }
embedded-hal-bus     = { workspace = true, features = ["async"] }
embedded-io-async    = { workspace = true }
portable-atomic      = { workspace = true }
cortex-m             = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt          = "0.7"
asic-cpu-mock        = { workspace = true, optional = true }
asic-uart-peer       = { workspace = true, optional = true }
stratum-client       = { workspace = true, optional = true }
stratum-v1           = { workspace = true, optional = true }
ubos-monitor         = { workspace = true, features = ["defmt"] }
ubos-temperature     = { workspace = true, features = ["defmt"] }
mmm                  = { workspace = true, optional = true, features = ["defmt"] }
ubos-psu             = { workspace = true, optional = true, features = ["defmt"] }
serial-baudrate      = { workspace = true, optional = true }
embassy-embedded-hal = { version = "0.6.0", optional = true, default-features = false, features = ["defmt"] }
embassy-sync         = { workspace = true, optional = true, features = ["defmt"] }

# cortex-m and cortex-m-rt are pulled in by `#[embassy_executor::main]` and
# the linker scripts; no direct source references, so machete can't see them.
[package.metadata.cargo-machete]
ignored = ["cortex-m", "cortex-m-rt"]
