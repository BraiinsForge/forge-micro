[target.thumbv8m.main-none-eabihf]
runner = "./scripts/run.sh"

[env]
DEFMT_LOG = "debug,embassy_net=info,smoltcp=info"

[build]
target = "thumbv8m.main-none-eabihf"

# `cargo run-N` flashes one of the six bmm-pico boards. Each alias
# sets $PROBE_SERIAL via cargo's [env] table so scripts/run.sh picks
# the matching `--probe`. The bare `cargo run` leaves the variable
# unset, so probe-rs auto-selects when only one probe is attached.
# The env table is used instead of overriding the runner from the
# alias because cargo's --config merges arrays rather than replacing
# them, so a runner override would have concatenated arg lists.
[alias]
run-1 = ["run", "--config", "env.PROBE_SERIAL=\"2e8a:000c:FA67CE4A27C3E7EF\""]
run-2 = ["run", "--config", "env.PROBE_SERIAL=\"2e8a:000c:88BB90F0F41E72CA\""]
run-3 = ["run", "--config", "env.PROBE_SERIAL=\"2e8a:000c:D6116FA12FA4716C\""]
run-4 = ["run", "--config", "env.PROBE_SERIAL=\"2e8a:000c:330584C1CAFB25E0\""]
run-5 = ["run", "--config", "env.PROBE_SERIAL=\"2e8a:000c:B6E765A6D8F55506\""]
run-6 = ["run", "--config", "env.PROBE_SERIAL=\"2e8a:000c:E4A10693F025DCA6\""]
