[target.thumbv8m.main-none-eabihf]
runner = "probe-rs-board-run"

# POOL_* env vars seed Config::default() at compile time. They only
# matter on first boot or after a schema mismatch; a persisted config
# in flash supersedes them.
[env]
# The brand this board ships; brand/README.md holds the table and the format.
UBOS_BRAND = { value = "../../brand/ubos", relative = true }
# This board ships no fee slot; docs/DEVFEE.md says how the line is read.
DEVFEE = "0"
# The shared probe-rs-board-run cargo runner reads the chip from here.
PROBE_RS_CHIP = "RP235x"
DEFMT_LOG = "debug,embassy_net=info,smoltcp=info"
POOL_USER = "braiinstest.dumb_worker"

[build]
target = "thumbv8m.main-none-eabihf"

# Every board of this family derives its own MAC from the RP2350 OTP chip
# id at boot, so one build serves all of them and no per-board flag is
# needed.
#
# `cargo run` flashes a board over a probe attached to this machine and
# auto-selects when only one probe is plugged in. Export $PROBE_SERIAL to
# pin a specific probe when several are. `cargo attach` connects to a
# board that is already running and streams its defmt logs without
# flashing or resetting it, setting $PROBE_RS_ACTION so probe-rs-board-run
# issues `probe-rs attach`. It still builds the firmware so the local ELF
# can decode the RTT stream; set $PROBE_RS_ELF to decode against a
# different binary when the board carries other firmware.
[alias]
attach = ["run", "--config", "env.PROBE_RS_ACTION=\"attach\""]
