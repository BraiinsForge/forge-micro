[package]
edition = "2021"
name    = "stratum-v1"
version = "0.1.0"

[features]
default = []
defmt   = ["dep:defmt"]

[dependencies]
defmt             = { workspace = true, optional = true }
embedded-io-async = { workspace = true }
heapless          = { workspace = true }
mining-protocol   = { workspace = true }
serde             = { version = "1", default-features = false, features = ["derive"] }
serde-json-core   = "0.6"

[dev-dependencies]
anyhow               = "1"
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
mining-protocol      = { workspace = true }
tokio                = { version = "1", features = ["rt", "macros", "io-util", "net"] }

[lints.clippy]
pedantic    = { level = "warn", priority = -1 }
unwrap_used = "deny"
