[package]
edition = "2021"
name    = "host-runner"
version = "0.1.0"

[lints]
workspace = true

[dependencies]
embassy-executor     = { workspace = true, features = ["platform-std", "executor-thread", "log"] }
embassy-net          = { workspace = true, features = ["log", "tcp", "udp", "dns", "dhcpv4", "medium-ethernet", "proto-ipv4", "auto-icmp-echo-reply"] }
embassy-net-driver   = "0.2"
embassy-time         = { workspace = true, features = ["std", "log"] }
embedded-io-async    = { workspace = true }
embedded-i2c-unix    = { path = "../embedded-i2c-unix" }
embedded-serial-unix = { path = "../embedded-serial-unix" }
critical-section   = { version = "1.2", features = ["std"] }
ctrlc              = "3"
env_logger         = "0.11"
gpiocdev           = "0.8"
# embassy-net 0.9's StaticConfigV4 needs heapless 0.9, while eth-examples
# still pins 0.8; both coexist here until the workspace bumps.
heapless           = "0.9"
heapless-v08       = { package = "heapless", version = "0.8" }
log                = { version = "0.4", default-features = false }
mmm                = { path = "../mmm", default-features = false }
static_cell        = { workspace = true }
eth-examples       = { workspace = true, default-features = false }
rand               = "0.8"
asic-cpu-mock      = { workspace = true }
mining-protocol    = { workspace = true }
stratum-client     = { workspace = true }
stratum-v1         = { workspace = true }
ubos-logging       = { workspace = true }
ubos-monitor       = { workspace = true }
ubos-psu           = { workspace = true }
embassy-sync       = { workspace = true }
portable-atomic    = { workspace = true }

# Bridged networking (afpacket) on the miniminer target; TAP on the dev
# host. Selected by target_arch in src/hosted_network.rs.
[target.'cfg(target_arch = "arm")'.dependencies]
embassy-net-afpacket = { path = "../embassy-net-afpacket" }

[target.'cfg(not(target_arch = "arm"))'.dependencies]
embassy-net-tuntap   = "0.1"
