stages:
  - lint # commit-message + formatting gate (cheap, fails fast)
  - clippy # per-crate clippy/check
  - check # tests, firmware release builds, static gates

default:
  # A gitlab-runner backed by dedicated remote nix builders, so the
  # /nix/store cache stays warm across jobs. The runner pins its own
  # docker image because its allowed_images is set, so we don't specify
  # one here. Jobs that need a different image must override `tags` and
  # set their own `image`.
  tags:
    - nix2

include:
  - local: .gitlab/ci/lint.yml
  - local: .gitlab/ci/check.yml
