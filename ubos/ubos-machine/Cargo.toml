[package]
publish.workspace = true
license.workspace = true
edition.workspace = true
name    = "ubos-machine"
version = "0.1.0"

[features]
# Formats the Forge Axe board errors for defmt, and forwards `defmt` to the
# component crates so a consumer that logs through defmt compiles them
# with the same backend.
defmt = [
    "dep:defmt",
    "ubos-asic/defmt",
    "ubos-eeprom/defmt",
    "ubos-psu/defmt",
    "ubos-temperature/defmt",
]

[lints]
workspace = true

[dependencies]
defmt            = { workspace = true, optional = true }
ubos-asic        = { workspace = true }
ubos-core        = { workspace = true }
ubos-eeprom      = { workspace = true }
ubos-psu         = { workspace = true }
ubos-temperature = { workspace = true }
