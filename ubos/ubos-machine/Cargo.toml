[package]
license.workspace = true
edition.workspace = true
name    = "ubos-machine"
version = "0.1.0"

[features]
# Forwards `defmt` to the component crates so a consumer that logs
# through defmt compiles them with the same backend.
defmt = ["ubos-asic/defmt", "ubos-psu/defmt", "ubos-temperature/defmt"]

[lints]
workspace = true

[dependencies]
ubos-asic        = { workspace = true }
ubos-psu         = { workspace = true }
ubos-temperature = { workspace = true }
