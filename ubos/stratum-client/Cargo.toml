[package]
license.workspace = true
edition.workspace = true
name    = "stratum-client"
version = "0.1.0"

[lints]
workspace = true

[features]
default = []
defmt   = ["dep:defmt", "mining-protocol/defmt", "ubos-events/defmt", "ubos-logging/defmt"]

[dependencies]
defmt           = { workspace = true, optional = true }
embassy-futures = { workspace = true }
embassy-sync    = { workspace = true }
embassy-time    = { workspace = true }
embedded-io-async = { workspace = true }
heapless        = { workspace = true }
mining-protocol = { workspace = true }
portable-atomic = { workspace = true }
ubos-core       = { workspace = true }
ubos-events     = { workspace = true, default-features = false }
ubos-logging    = { workspace = true }
ubos-metrics    = { workspace = true, default-features = false }

[dev-dependencies]
# The ntime-roll tests construct an `AsicSession`, whose `Watch`/`Channel`
# are `CriticalSectionRawMutex`-backed, so the host test binary needs a
# linkable critical-section implementation. The std impl is host-only and
# never reaches firmware.
critical-section = { version = "1.2", features = ["std"] }
# A test that takes the handle runs in a process of its own.
rusty-fork = { workspace = true }
# The test binary links the counter pushes, which stamp each metric
# with `embassy_time::Instant::now()`. The std time driver is
# host-only and never reaches firmware.
embassy-time     = { workspace = true, features = ["std", "generic-queue-8"] }

[package.metadata.cargo-machete]
ignored = ["defmt"]
