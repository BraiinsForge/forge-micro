[package]
publish.workspace = true
license.workspace = true
name    = "ubos-cooling"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt"]
defmt   = [
    "dep:defmt",
    "ubos-config/defmt",
    "ubos-logging/defmt",
    "ubos-thermal/defmt",
]

[dependencies]
embassy-sync    = { workspace = true }
embassy-time    = { workspace = true }
embassy-futures = { workspace = true }
bitfield-struct = { workspace = true }
embedded-hal-async = { workspace = true }
defmt           = { workspace = true, optional = true }
ubos-config     = { workspace = true, default-features = false }
ubos-core       = { workspace = true }
ubos-thermal    = { workspace = true, default-features = false }
ubos-metrics    = { workspace = true, default-features = false }
ubos-logging    = { workspace = true }
libm            = "0.2"
heapless        = { workspace = true }

[dev-dependencies]
# Driving `run_cooling` publishes on several `CriticalSectionRawMutex`-backed
# watches, so the host test binary needs a linkable critical-section
# implementation. The std impl is host-only and never reaches firmware.
critical-section = { workspace = true, features = ["std"] }
# The tests drive `run_cooling` on a virtual clock, stepping `Instant`
# forward with no real delay; `mock-driver` supplies that clock and
# `generic-queue-8` gives it the timer queue the ticker awaits on.
embassy-time     = { workspace = true, features = ["mock-driver", "generic-queue-8"] }
ubos-thermal     = { workspace = true }
# `FileStorage` is the store of the host, and the tests run the real config
# task on it.
ubos-config      = { workspace = true, default-features = false, features = ["std"] }
# The hashboard that the config task of the tests runs on.
ubos-asic        = { workspace = true }
# The reading that the sensor of the tests submits to thermal.
ubos-temperature = { workspace = true }
# The tests run the ingest task and read the series it stores.
ubos-metrics     = { workspace = true, default-features = false, features = ["metrics"] }
# Each test takes its handles in a process of its own.
rusty-fork       = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["defmt"]
