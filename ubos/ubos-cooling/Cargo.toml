[package]
name    = "ubos-cooling"
edition = "2021"
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt"]
defmt   = [
    "dep:defmt",
    "ubos-config/defmt",
    "ubos-logging/defmt",
    "ubos-thermal/defmt",
]

[dependencies]
defmt        = { workspace = true, optional = true }
ubos-config  = { workspace = true, default-features = false }
ubos-core    = { workspace = true }
ubos-thermal = { workspace = true, default-features = false }
ubos-metrics = { workspace = true, default-features = false }
ubos-logging = { workspace = true }
libm         = "0.2"
heapless     = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["defmt"]
