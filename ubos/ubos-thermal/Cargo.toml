[package]
name    = "ubos-thermal"
edition = "2021"
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt"]
defmt   = [
    "dep:defmt",
    "embassy-time/defmt",
    "ubos-config/defmt",
    "ubos-logging/defmt",
    "ubos-manager/defmt",
    "ubos-temperature/defmt",
]

[dependencies]
embassy-sync     = { workspace = true }
embassy-time     = { workspace = true }
defmt            = { workspace = true, optional = true }
ubos-config      = { workspace = true, default-features = false }
ubos-core        = { workspace = true }
ubos-manager     = { workspace = true, default-features = false }
ubos-temperature = { workspace = true, default-features = false }
ubos-logging     = { workspace = true }
