[package]
license.workspace = true
name    = "ubos-thermal"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt"]
defmt   = [
    "dep:defmt",
    "embassy-time/defmt",
    "ubos-config/defmt",
    "ubos-events/defmt",
    "ubos-logging/defmt",
    "ubos-manager/defmt",
    "ubos-metrics/defmt",
    "ubos-temperature/defmt",
]
# Exposes a hook that publishes a `ThermalReading` directly onto the
# module-internal watch, bypassing `run_thermal`. Host tests in other
# crates use it to drive their own thermal-consuming loop without
# spawning a real sensor task. No effect on production builds.
test-util = []

[dependencies]
embassy-sync       = { workspace = true }
embassy-time       = { workspace = true }
embedded-hal-async = { workspace = true }
defmt              = { workspace = true, optional = true }
heapless           = { workspace = true }
ubos-config        = { workspace = true, default-features = false }
ubos-core          = { workspace = true }
ubos-events        = { workspace = true, default-features = false }
ubos-manager       = { workspace = true, default-features = false }
ubos-metrics       = { workspace = true, default-features = false }
ubos-temperature   = { workspace = true, default-features = false }
ubos-logging       = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["defmt"]
