[package]
license.workspace = true
name    = "ubos-thermal"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt"]
defmt   = [
    "dep:defmt",
    "embassy-time/defmt",
    "ubos-config/defmt",
    "ubos-events/defmt",
    "ubos-logging/defmt",
    "ubos-manager/defmt",
    "ubos-metrics/defmt",
    "ubos-mining/defmt",
    "ubos-temperature/defmt",
]
# Exposes a hook that publishes a `ThermalReading` directly onto the
# module-internal watch, bypassing `run_thermal`. Host tests in other
# crates use it to drive their own thermal-consuming loop without
# spawning a real sensor task. No effect on production builds.
test-util = []

[dependencies]
embassy-futures    = { workspace = true }
embassy-sync       = { workspace = true }
embassy-time       = { workspace = true }
embedded-hal-async = { workspace = true }
defmt              = { workspace = true, optional = true }
heapless           = { workspace = true }
ubos-asic          = { workspace = true }
ubos-config        = { workspace = true, default-features = false }
ubos-core          = { workspace = true }
ubos-events        = { workspace = true, default-features = false }
ubos-manager       = { workspace = true, default-features = false }
ubos-metrics       = { workspace = true, default-features = false }
# The sensor reads each chain's presence and publishes its hottest die
# through `ChainStats`. The edge is already there by way of
# `ubos-manager`, which this crate halts mining through.
ubos-mining        = { workspace = true, default-features = false }
ubos-temperature   = { workspace = true, default-features = false }
ubos-logging       = { workspace = true }

[dev-dependencies]
# The chain sensor keeps its silence clocks on `Instant`, so the host tests
# need the standard time driver, and the PVT store's atomics need a
# critical-section backend on the host. The sensor's report awaits a real
# `Ticker`, which needs a queue implementation, so `generic-queue-8` joins
# `std` here the same way `ubos-mining` and `ubos-cooling` already carry it.
embassy-time     = { workspace = true, features = ["std", "generic-queue-8"] }
critical-section = { version = "1.2", features = ["std"] }
# The accounting handle the tests build takes its wired-chain count as an
# atomic of the same crate `ubos-mining` uses.
portable-atomic  = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["defmt"]
