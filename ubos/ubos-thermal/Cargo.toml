[package]
license.workspace = true
name    = "ubos-thermal"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt"]
defmt   = [
    "dep:defmt",
    "embassy-time/defmt",
    "ubos-config/defmt",
    "ubos-core/defmt",
    "ubos-events/defmt",
    "ubos-logging/defmt",
    "ubos-manager/defmt",
    "ubos-metrics/defmt",
    "ubos-temperature/defmt",
]

[dependencies]
embassy-futures    = { workspace = true }
embassy-sync       = { workspace = true }
embassy-time       = { workspace = true }
embedded-hal-async = { workspace = true }
defmt              = { workspace = true, optional = true }
heapless           = { workspace = true }
ubos-asic          = { workspace = true }
ubos-config        = { workspace = true, default-features = false }
ubos-core          = { workspace = true }
ubos-events        = { workspace = true, default-features = false }
ubos-manager       = { workspace = true, default-features = false }
ubos-metrics       = { workspace = true, default-features = false }
ubos-temperature   = { workspace = true, default-features = false }
ubos-logging       = { workspace = true }

[dev-dependencies]
# The chain sensor's silence clocks and the PVT store's atomics need a
# critical-section backend on the host, and `generic-queue-8` gives the
# `Ticker` these tests await a timer queue to register on. `mock-driver`
# gives the `run_thermal` test a virtual clock, the same way
# `ubos-cooling`'s `run_cooling` tests step past `STALE_INTERVAL_MULTIPLIER`
# ticks with no real delay; it replaces the `std` driver rather than
# joining it; a build cannot link two time drivers.
embassy-time     = { workspace = true, features = ["generic-queue-8", "mock-driver"] }
critical-section = { version = "1.2", features = ["std"] }
# The accounting handle the tests build takes its wired-chain count as an
# atomic of the same crate `ubos-metrics` uses.
portable-atomic  = { workspace = true }
# The `run_thermal` tests run the real manager, which halts mining through
# its handle, and take every handle in a process of their own.
ubos-mining      = { workspace = true, default-features = false }
rusty-fork       = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["defmt"]
