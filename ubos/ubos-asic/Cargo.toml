[package]
publish.workspace = true
license.workspace = true
edition.workspace = true
name    = "ubos-asic"
version = "0.1.0"

[lints]
workspace = true

[features]
default = []
defmt   = ["dep:defmt", "ubos-config/defmt", "ubos-core/defmt"]

[dependencies]
bitfield-struct = { workspace = true }
embassy-sync    = { workspace = true }
embassy-time    = { workspace = true }
defmt           = { workspace = true, optional = true }
heapless        = { workspace = true }
sha2            = { workspace = true }
# A hashboard descriptor holds the values its model hands to a new
# config, in the type the config schema declares.
ubos-config     = { workspace = true }
ubos-core       = { workspace = true }
ubos-temperature = { workspace = true }

[dev-dependencies]
# The store keeps a chip's silence on `Instant`, so the host tests need
# the standard time driver, and its mutex needs a critical-section
# backend on the host.
embassy-time     = { workspace = true, features = ["std"] }
critical-section = { workspace = true, features = ["std"] }
mining-protocol  = { workspace = true }
