[package]
license.workspace = true
name = "ubos-stm32"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[dependencies]
ubos-core = { workspace = true }
ubos-cooling = { workspace = true }
ubos-thermal = { workspace = true }
serial-baudrate = { workspace = true }
embedded-io-async = { workspace = true }
embassy-time = { workspace = true }
defmt = { workspace = true }
portable-atomic = { workspace = true }
critical-section = { version = "1" }

# No chip feature here: the crate builds under both stm32f407 and
# stm32f439, so the board or the flake check selects the chip.
embassy-stm32 = { version = "0.6.0", default-features = false, features = ["rt", "time", "unstable-pac"] }
