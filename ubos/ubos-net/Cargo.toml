[package]
name    = "ubos-net"
edition = "2021"
version = "0.1.0"

[lints]
workspace = true

[features]
default    = ["defmt"]
defmt      = ["dep:defmt", "embassy-net/defmt", "ubos-logging/defmt"]
ccmram-bss = []

[dependencies]
embassy-net       = { workspace = true, features = ["tcp", "udp", "dns", "dhcpv4", "medium-ethernet", "auto-icmp-echo-reply"] }
embassy-time      = { workspace = true }
embassy-sync      = { workspace = true }
heapless          = { workspace = true }
portable-atomic   = { workspace = true }
defmt             = { workspace = true, optional = true }
ubos-core         = { workspace = true }
ubos-logging      = { workspace = true }
