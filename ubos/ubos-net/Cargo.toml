[package]
publish.workspace = true
license.workspace = true
name    = "ubos-net"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default    = ["defmt"]
defmt      = ["dep:defmt", "embassy-net/defmt", "ubos-logging/defmt", "ubos-events/defmt", "ubos-config/defmt", "ubos-auth/defmt", "ubos-metrics/defmt"]

[dependencies]
embassy-net       = { workspace = true, features = ["tcp", "udp", "dns", "dhcpv4", "medium-ethernet", "auto-icmp-echo-reply"] }
embassy-time      = { workspace = true }
embassy-sync      = { workspace = true }
embassy-futures   = { workspace = true }
heapless          = { workspace = true }
defmt             = { workspace = true, optional = true }
ubos-core         = { workspace = true }
ubos-events       = { workspace = true, default-features = false }
ubos-logging      = { workspace = true }
ubos-metrics      = { workspace = true, default-features = false }
ubos-config       = { workspace = true, default-features = false }
ubos-auth         = { workspace = true, default-features = false }

[dev-dependencies]
# A test publishes on a `CriticalSectionRawMutex`-backed watch, so the host
# test binary needs a linkable critical-section implementation. The std impl
# is host-only and never reaches firmware.
critical-section = { workspace = true, features = ["std"] }
# A test that takes the handle runs in a process of its own.
rusty-fork = { workspace = true }
