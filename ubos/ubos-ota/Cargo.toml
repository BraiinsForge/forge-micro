[package]
publish.workspace = true
license.workspace = true
name = "ubos-ota"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt"]
defmt = ["dep:defmt", "ubos-api/defmt", "ubos-mining/defmt"]

[dependencies]
ubos-api = { workspace = true, default-features = false }
ubos-mining = { workspace = true, default-features = false }
embassy-sync = { workspace = true }
embedded-storage = { workspace = true }
defmt = { workspace = true, optional = true }
