[package]
name    = "ubos-firmware"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[dependencies]
defmt          = { workspace = true }
embassy-futures = { workspace = true }
embassy-net    = { workspace = true }
embassy-time   = { workspace = true }
heapless       = { workspace = true }
ii-sv2         = { workspace = true, features = ["lowmemory"] }
rand_chacha    = { workspace = true }
static_cell    = { workspace = true }
stratum-client = { workspace = true, features = ["defmt"] }
stratum-v1     = { workspace = true, features = ["defmt"] }
stratum-v2     = { workspace = true, features = ["defmt"] }
# defmt is enabled on every subsystem crate so this crate's feature set
# matches the boards': stratum-client's `defmt` turns on `ubos-logging/defmt`,
# and once the logging macros expand to `defmt::` every crate that uses them
# must link defmt too. The boards enable defmt uniformly; this mirrors that.
ubos-api       = { workspace = true, features = ["defmt"] }
ubos-config    = { workspace = true, features = ["defmt"] }
ubos-events    = { workspace = true, features = ["defmt"] }
ubos-manager   = { workspace = true, features = ["defmt"] }
ubos-mining    = { workspace = true, features = ["defmt"] }
ubos-net       = { workspace = true, features = ["defmt"] }
ubos-psu       = { workspace = true, features = ["defmt"] }
ubos-thermal   = { workspace = true, features = ["defmt"] }
