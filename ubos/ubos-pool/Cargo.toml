[package]
name    = "ubos-pool"
edition = "2021"
version = "0.1.0"

[lints]
workspace = true

[dependencies]
embassy-time = { workspace = true }
heapless     = { workspace = true }
# Base58check decode for `POOL_SV2_PUBKEY`. `no_std` build via
# `default-features = false`, matches micro-sv2's posture.
bs58         = { version = "0.5", default-features = false, features = ["check"] }

[dev-dependencies]
# Host tests assemble base58check strings via `.into_string()`,
# which needs the `alloc` feature on top of `check`. The lib
# build never sees the extra feature.
bs58 = { version = "0.5", default-features = false, features = ["check", "alloc"] }
