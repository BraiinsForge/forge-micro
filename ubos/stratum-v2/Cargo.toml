[package]
publish.workspace = true
license.workspace = true
edition.workspace = true
name    = "stratum-v2"
version = "0.1.0"

[lints]
workspace = true

[dependencies]
defmt             = { workspace = true, optional = true }
embedded-io-async = { workspace = true }
heapless          = { workspace = true }
ii-sv2            = { workspace = true }
mining-protocol   = { workspace = true }
ubos-logging      = { workspace = true }

[dev-dependencies]
anyhow               = "1"
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
# The host probe constructs `CryptoCtx::new()` which needs alloc;
# the lib itself stays no_std + no-alloc, and firmware consumers
# inherit the workspace default of `default-features = false`.
ii-sv2               = { workspace = true, features = ["alloc"] }
rand                 = "0.10"
rand_chacha          = "0.10"
tokio                = { version = "1", features = ["rt", "macros", "io-util", "net"] }

[features]
default = []
defmt   = ["dep:defmt", "mining-protocol/defmt", "ubos-logging/defmt"]

[package.metadata.cargo-machete]
ignored = ["defmt"]
