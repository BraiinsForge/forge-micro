[package]
license.workspace = true
name    = "ubos-config"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default  = ["defmt"]
defmt    = [
    "dep:defmt",
    "heapless/defmt",
    "ubos-core/defmt",
    "ubos-events/defmt",
    "ubos-logging/defmt",
]
std    = ["postcard/use-std"]
# Host-only: JSON Schema derives the OpenAPI document is built from.
schema = ["dep:schemars"]

[dependencies]
embassy-sync           = { workspace = true }
embassy-futures        = { workspace = true }
embassy-time           = { workspace = true }
portable-atomic        = { workspace = true }
defmt                  = { workspace = true, optional = true }
heapless               = { workspace = true, features = ["serde"] }
serde                  = { version = "1", default-features = false, features = ["derive"] }
ubos-asic              = { workspace = true }
ubos-core              = { workspace = true }
ubos-events            = { workspace = true, default-features = false }
ubos-logging           = { workspace = true }
postcard               = { workspace = true }
postcard-schema        = { workspace = true }
schemars               = { workspace = true, optional = true }
sequential-storage     = { workspace = true }
embedded-storage       = { workspace = true }
embedded-storage-async = { workspace = true }
bs58                   = { version = "0.5", default-features = false }
sha2                   = { workspace = true }

[dev-dependencies]
serde_json             = { workspace = true }
# `block_on` drives `async fn` tests against `FileStorage`, whose
# methods have no real suspend points, so the future resolves on the
# first poll. Pattern mirrors the ubos-auth test suite.
embassy-futures        = { workspace = true }
# Driving `factory_reset` publishes on the `CriticalSectionRawMutex`-backed
# `STATE_WATCH`, so the host test binary needs a linkable critical-section
# implementation. The std impl is host-only and never reaches firmware.
critical-section       = { version = "1.2", features = ["std"] }
# Exercises the exact wire codec `ubos-api` uses for `POST /api/config`
# so the pool-weight round-trip test covers the real serialization path.
serde-json-core        = { workspace = true }
