[package]
license.workspace = true
name    = "ubos-api"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt"]
defmt   = ["dep:defmt", "embassy-net/defmt", "stratum-client/defmt", "ubos-auth/defmt", "ubos-config/defmt", "ubos-cooling/defmt", "ubos-events/defmt", "ubos-logging/defmt", "ubos-mdns/defmt", "ubos-net/defmt", "ubos-http/defmt", "ubos-manager/defmt", "ubos-metrics/defmt", "ubos-mining/defmt", "ubos-psu/defmt", "ubos-thermal/defmt"]
# Host-only: JSON Schema derives the OpenAPI document is built from.
schema = ["dep:schemars", "ubos-config/schema"]

[dependencies]
edge-http         = { workspace = true, features = ["io"] }
edge-nal          = { workspace = true }
embassy-futures   = { workspace = true }
embassy-net       = { workspace = true, features = ["tcp"] }
embassy-sync      = { workspace = true }
embassy-time      = { workspace = true }
embedded-io-async = { workspace = true }
ubos-auth         = { workspace = true, default-features = false }
heapless          = { workspace = true, features = ["serde"] }
portable-atomic   = { workspace = true }
serde             = { workspace = true }
serde-json-core   = { workspace = true }
schemars          = { workspace = true, optional = true }
defmt             = { workspace = true, optional = true }
stratum-client    = { workspace = true }
ubos-config       = { workspace = true, default-features = false }
ubos-cooling      = { workspace = true, default-features = false }
ubos-core         = { workspace = true }
ubos-events       = { workspace = true, default-features = false }
ubos-http         = { workspace = true, default-features = false }
ubos-mdns         = { workspace = true, default-features = false }
ubos-logging      = { workspace = true }
ubos-manager      = { workspace = true, default-features = false }
ubos-metrics      = { workspace = true, default-features = false }
ubos-mining       = { workspace = true, default-features = false }
ubos-net          = { workspace = true, default-features = false }
ubos-psu          = { workspace = true, default-features = false }
ubos-thermal      = { workspace = true, default-features = false }

[dev-dependencies]
serde_json        = { workspace = true }
critical-section  = { version = "1.2", features = ["std"] }
# Each test that takes handles runs in a process of its own.
rusty-fork        = { workspace = true }
embassy-futures   = { workspace = true }
# The resume and clear tests publish the flag of thermal as its task does.
ubos-thermal = { workspace = true, default-features = false, features = ["test-util"] }
