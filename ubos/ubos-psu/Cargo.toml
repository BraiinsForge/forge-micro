[package]
license.workspace = true
name        = "ubos-psu"
edition.workspace = true
version     = "0.1.0"
description = "no_std async PSU driver, generic over embedded-hal-async I2C."

[lints]
workspace = true

[dependencies]
embedded-hal       = { workspace = true }
embedded-hal-async = { workspace = true }
embassy-futures    = { workspace = true }
embassy-sync       = { workspace = true }
embassy-time       = { workspace = true }
heapless           = { workspace = true }
portable-atomic    = { workspace = true }
defmt              = { workspace = true, optional = true }
ubos-core          = { workspace = true }
ubos-events        = { workspace = true, default-features = false }
ubos-logging       = { workspace = true }
ubos-metrics       = { workspace = true, default-features = false }

[dev-dependencies]
embedded-hal-mock  = { version = "0.11", default-features = false, features = ["embedded-hal-async", "eh1"] }
embassy-time       = { workspace = true, features = ["std", "generic-queue-8"] }
static_cell        = { workspace = true }
critical-section   = { version = "1.2", features = ["std"] }
rusty-fork         = { workspace = true }

[features]
default = []
defmt   = ["dep:defmt", "ubos-events/defmt", "ubos-logging/defmt", "ubos-metrics/defmt"]

[package.metadata.cargo-machete]
ignored = ["defmt"]
