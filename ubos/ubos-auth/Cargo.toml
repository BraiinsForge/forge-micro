[package]
name    = "ubos-auth"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default    = ["defmt"]
defmt      = ["dep:defmt", "ubos-logging/defmt"]
# Opt-in for cortex-m boards whose linker exposes a `.ccmram.bss`
# section. Relocates credential, session, CSRF, and CSPRNG state off
# main SRAM. The `link_section` attribute alone does not pull any
# symbol from `ubos-core`, so no dep on it is required here.
ccmram-bss = []

[dependencies]
embassy-sync    = { workspace = true }
embassy-time    = { workspace = true }
heapless        = { workspace = true, features = ["serde"] }
portable-atomic = { workspace = true }
rand_chacha     = { workspace = true }
ubos-logging    = { workspace = true }
defmt           = { workspace = true, optional = true }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
embassy-futures  = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["defmt"]
