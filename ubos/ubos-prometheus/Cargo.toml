[package]
publish.workspace = true
license.workspace = true
name    = "ubos-prometheus"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt"]
defmt   = ["ubos-http/defmt", "ubos-mdns/defmt", "ubos-metrics/defmt", "ubos-net/defmt"]

[dependencies]
edge-http         = { workspace = true, features = ["io"] }
edge-nal          = { workspace = true }
embassy-time      = { workspace = true }
embedded-io-async = { workspace = true }
ubos-core         = { workspace = true }
ubos-http         = { workspace = true, default-features = false }
ubos-mdns         = { workspace = true, default-features = false }
# The service reads the store, which exists only with this feature.
ubos-metrics      = { workspace = true, default-features = false, features = ["metrics"] }
ubos-net          = { workspace = true, default-features = false }
