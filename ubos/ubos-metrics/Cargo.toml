[package]
name    = "ubos-metrics"
edition = "2021"
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt"]
defmt   = ["dep:defmt", "embassy-net/defmt", "ubos-logging/defmt", "ubos-mdns/defmt", "ubos-net/defmt", "ubos-http/defmt", "edge-http/defmt"]
# Opt-in for cortex-m boards whose linker exposes a `.ccmram.bss`
# section. Moves the metric map and the scrape scratch buffers off
# main SRAM so the stm32f4 boards fit; no effect on boards that do
# not declare the section.
ccmram-bss = []

[dependencies]
edge-http         = { workspace = true, features = ["io"] }
edge-nal          = { workspace = true }
edge-nal-embassy  = { workspace = true, features = ["tcp", "proto-ipv4", "medium-ethernet"] }
embassy-futures   = { workspace = true }
embassy-net       = { workspace = true, features = ["tcp"] }
embassy-sync      = { workspace = true }
embassy-time      = { workspace = true }
embedded-io-async = { workspace = true }
heapless          = { workspace = true }
portable-atomic   = { workspace = true }
static_cell       = { workspace = true }
defmt             = { workspace = true, optional = true }
ubos-core         = { workspace = true }
ubos-http         = { workspace = true, default-features = false }
ubos-logging      = { workspace = true }
ubos-mdns         = { workspace = true, default-features = false }
ubos-net          = { workspace = true, default-features = false }

# Cortex-M boards drive embassy's `raw::Executor` directly via
# `cpu_load::run_cortex_m_executor`. Gated to ARM so the ESP32-S3
# build does not pull in the cortex-m crate.
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m          = "0.7"
embassy-executor  = { workspace = true }
