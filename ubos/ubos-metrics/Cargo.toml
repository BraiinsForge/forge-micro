[package]
publish.workspace = true
license.workspace = true
name    = "ubos-metrics"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt", "metrics"]
defmt   = ["dep:defmt", "ubos-core/defmt", "ubos-logging/defmt"]
# The metrics store: the channel, the series map and the render buffer.
# A firmware without it frees the RAM they hold, and every push then
# returns at once. Only a firmware asks for it, through `ubos-firmware`,
# because a library crate only pushes.
metrics = []

[dependencies]
embassy-sync      = { workspace = true }
embassy-time      = { workspace = true }
heapless          = { workspace = true }
portable-atomic   = { workspace = true }
static_cell       = { workspace = true }
defmt             = { workspace = true, optional = true }
ubos-core         = { workspace = true }
ubos-logging      = { workspace = true }

[dev-dependencies]
# The store tests stamp samples with `Instant`, so the host tests need
# the standard time driver, and the atomics of the store need a
# critical-section backend on the host.
embassy-time     = { workspace = true, features = ["std"] }
critical-section = { workspace = true, features = ["std"] }

# Cortex-M boards drive embassy's `raw::Executor` directly via
# `cpu_load::run_cortex_m_executor`. Gated to ARM so the ESP32-S3
# build does not pull in the cortex-m crate.
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m          = "0.7"
embassy-executor  = { workspace = true }

# The `ubos_logging` macros expand to `defmt::` paths at the call site,
# so defmt is a real dependency that no source here names.
[package.metadata.cargo-shear]
ignored = ["defmt"]
