[package]
license.workspace = true
edition.workspace = true
name    = "ubos-mining"
version = "0.1.0"

[features]
default = ["defmt"]
defmt   = [
    "dep:defmt",
    "stratum-client/defmt",
    "ubos-events/defmt",
    "ubos-logging/defmt",
    "ubos-psu/defmt",
]
# Opt-in for cortex-m boards whose linker exposes a `.ccmram.bss`
# section. Moves the SERIAL mailbox and its buffers, mining state
# watch, command channel, stop signal, and desync counter off main
# SRAM so the stm32f407 fits; no effect on boards that do not declare
# the section. None of the relocated statics are DMA targets.
ccmram-bss    = []

[lints]
workspace = true

[dependencies]
defmt             = { workspace = true, optional = true }
embassy-futures   = { workspace = true }
embassy-sync      = { workspace = true }
embassy-time      = { workspace = true }
# `OutputResetPin` drives any HAL output through the `OutputPin` trait.
embedded-hal      = { workspace = true }
embedded-io       = "0.7"
embedded-io-async = { workspace = true }
heapless          = { workspace = true }
libm              = { workspace = true }
portable-atomic   = { workspace = true }
serial-baudrate   = { workspace = true }
ubos-config       = { workspace = true, default-features = false }
ubos-core         = { workspace = true }
ubos-events       = { workspace = true, default-features = false }
# Pulled in for the hashrate metric only; the `default-features =
# false` flavor keeps ubos-metrics no-defmt for ubos-mining consumers
# that don't already enable defmt themselves.
ubos-metrics      = { workspace = true, default-features = false }
mining-protocol   = { workspace = true }
stratum-client    = { workspace = true }
ubos-asic         = { workspace = true }
ubos-logging      = { workspace = true }
ubos-psu          = { workspace = true }
ubos-tuner        = { workspace = true }

[dev-dependencies]
# The dispatch tests construct an `AsicSession`, whose `Watch`/`Channel`
# are `CriticalSectionRawMutex`-backed, so the host test binary needs a
# linkable critical-section implementation. The std impl is host-only and
# never reaches firmware.
critical-section = { version = "1.2", features = ["std"] }
# The diff-1 dispatch test drives a real chip share through
# `record_share`, which reads `embassy_time::Instant::now()`. The std
# time driver is host-only and never reaches firmware. The result-arm
# tests drive `Serial::run` itself, which awaits a real `Ticker`; that
# needs a queue implementation, so `generic-queue-8` joins `std` here
# the same way `ubos-psu` and `ubos-cooling` already carry it.
embassy-time = { workspace = true, features = ["std", "generic-queue-8"] }
