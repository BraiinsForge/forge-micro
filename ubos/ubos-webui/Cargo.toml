[package]
license.workspace = true
name    = "ubos-webui"
edition.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt"]
defmt   = ["dep:defmt", "ubos-auth/defmt", "ubos-config/defmt", "ubos-http/defmt", "ubos-logging/defmt", "ubos-mdns/defmt", "ubos-net/defmt"]
# Opt-in for cortex-m boards whose linker exposes a `.ccmram.bss`
# section. Relocates the HTTP scratch buffers off main SRAM. Pairs
# with the same feature on `ubos-metrics` and `ubos-core`. The
# `ubos-core` feature is required so the pre-init zeroing helper is
# compiled in.
ccmram-bss = ["ubos-core/ccmram-bss"]

[build-dependencies]
# Used by `build.rs` to gzip each Vite single-file page
# (`index.html`, `login.html`) so the firmware ships each page with
# `Content-Encoding: gzip`. Zopfli emits standard gzip streams a few
# percent smaller than flate2 level 9; browsers only advertise `br`
# over HTTPS, so gzip is the best encoding plain HTTP can ship. The
# `zlib` default is not needed and stays off.
zopfli = { version = "0.8", default-features = false, features = ["std", "gzip"] }
# Used by `build.rs` to read the declared brand's `brand.json`. It runs
# on the host and never reaches the firmware image, so it does not move
# the page budget.
serde_json = "1"
# Used by `build.rs` to encode the brand's `icon.png` into the `data:`
# URI each page carries. Host-side like the two above.
base64 = "0.22"

[dependencies]
edge-http         = { workspace = true, features = ["io"] }
edge-nal          = { workspace = true }
embedded-io-async = { workspace = true }
heapless          = { workspace = true }
defmt             = { workspace = true, optional = true }
ubos-auth         = { workspace = true, default-features = false }
ubos-config       = { workspace = true, default-features = false }
ubos-core         = { workspace = true }
ubos-http         = { workspace = true, default-features = false }
ubos-logging      = { workspace = true }
ubos-mdns         = { workspace = true, default-features = false }
ubos-net          = { workspace = true, default-features = false }

[dev-dependencies]
flate2           = "1"
critical-section = { version = "1.2", features = ["std"] }

# defmt is gated behind the defmt feature; ubos-logging is pulled only to
# wire its defmt feature and provide the global logger, never referenced by
# name in source; ubos-core is pulled only to wire its ccmram-bss feature.
# machete cannot see any of these uses, so all three are ignored.
[package.metadata.cargo-machete]
ignored = ["defmt", "ubos-core", "ubos-logging"]
