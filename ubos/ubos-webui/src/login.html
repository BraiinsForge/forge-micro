<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>microBOS — Login</title>
  <!-- Apply the saved theme preference before first paint so the page never flashes the wrong palette. data-theme-pref keeps the operator's choice (auto, light, dark) and drives the cycler icon; data-theme holds the resolved palette and may flip live when prefers-color-scheme changes. Inlined as one line because build.rs's minify_html collapses newlines and asserts each source line starts with '<'. -->
  <script>(function () { var pref; try { pref = localStorage.getItem('theme'); } catch (error) { } if (pref !== 'light' && pref !== 'dark') pref = 'auto'; document.documentElement.dataset.themePref = pref; document.documentElement.dataset.theme = pref === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref; })();</script>
  <!--CSS-->
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/logo.svg" alt="Braiins">
      <span class="mu">µ</span>
    </div>
    <div class="err" id="err">Invalid username or password.</div>
    <form method="post" action="/login">
      <label for="u">Username</label>
      <input id="u" name="username" type="text" autocomplete="username" required>
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <footer class="bar ft">
    <span class="bi">{{BUILD_REV}} · {{BUILD_TIME}}</span>
    <button type="button" class="thm" id="thm" aria-label="Cycle theme: auto, light, dark">
      <svg class="thmIcon iAuto" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 30A14 14 0 1 1 30 16 14.016 14.016 0 0 1 16 30ZM16 4A12 12 0 1 0 28 16 12.013 12.013 0 0 0 16 4Z"/><path d="M16 28V4a12 12 0 0 1 0 24Z"/></svg>
      <svg class="thmIcon iSun" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 18a2 2 0 1 1 2-2 2 2 0 0 1-2 2m0-6a4 4 0 1 0 4 4 4 4 0 0 0-4-4M5.394 6.813 6.81 5.397l3.18 3.18-1.417 1.415zM2 15h4v2H2zm3.394 10.189 3.18-3.18 1.412 1.412-3.18 3.18zM15 26h2v4h-2zm7.404-2.586 1.412-1.414 3.18 3.18-1.41 1.412zm3-8.414h4v2h-4zm-3-7.404 3.18-3.18 1.41 1.418-3.18 3.18zM15 2h2v4h-2z"/></svg>
      <svg class="thmIcon iMoon" viewBox="0 0 32 32" aria-hidden="true"><path d="M13.502 5.414a15.075 15.075 0 0 0 11.594 18.194 11.113 11.113 0 0 1-7.975 3.39c-.138 0-.278.005-.418 0a11.094 11.094 0 0 1-3.2-21.584M14.98 3a1.002 1.002 0 0 0-.175.016 13.096 13.096 0 0 0 1.825 25.981c.164.006.328 0 .49 0a13.072 13.072 0 0 0 10.703-5.555 1.01 1.01 0 0 0-.783-1.565A13.08 13.08 0 0 1 15.89 4.38 1.015 1.015 0 0 0 14.98 3"/></svg>
    </button>
  </footer>
  <!--JS-->
</body>
</html>
