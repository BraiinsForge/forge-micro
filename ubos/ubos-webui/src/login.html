<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>microBOS — Login</title>
<style>
:root{--bg:#262626;--panel:#161616;--field:#393939;--border:#525252;--fg:#fff;--mute:#a8a8a8;--accent:#6b50ff;--accent-hi:#8b7cff;--red:#d9222c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:32px;width:100%;max-width:360px}
h1{margin:0 0 24px;font-size:1.1rem;font-weight:600;color:var(--accent-hi)}
label{display:block;margin-bottom:4px;font-size:.85rem;color:var(--mute)}
input{display:block;width:100%;background:var(--field);border:1px solid var(--border);border-radius:4px;color:var(--fg);padding:8px 10px;font-size:.95rem;margin-bottom:16px;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;background:var(--accent);border:none;border-radius:4px;color:#fff;padding:9px;font-size:.95rem;cursor:pointer}
button:hover{background:var(--accent-hi)}
.err{color:var(--red);font-size:.85rem;margin-bottom:12px;display:none}
.err.show{display:block}
</style>
</head><body>
<div class="card">
<h1>microBOS Login</h1>
<div class="err" id="err">Invalid username or password.</div>
<form method="post" action="/login">
<label for="u">Username</label>
<input id="u" name="username" type="text" autocomplete="username" required>
<label for="p">Password</label>
<input id="p" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
</form>
</div>
<script>
const params=new URLSearchParams(location.search);
if(params.get('err')){document.getElementById('err').classList.add('show');}
</script>
</body></html>
