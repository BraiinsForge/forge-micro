[package]
edition = "2021"
name    = "ubos-monitor"
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt"]
defmt   = [
    "dep:defmt",
    "embassy-time/defmt",
    "ubos-logging/defmt",
]

[dependencies]
embassy-sync     = { workspace = true }
embassy-time     = { workspace = true }
defmt            = { workspace = true, optional = true }
eth-examples     = { workspace = true, default-features = false }
heapless         = { workspace = true }
libm             = "0.2"
ubos-logging     = { workspace = true }
