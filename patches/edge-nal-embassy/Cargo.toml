[package]
name = "edge-nal-embassy"
version = "0.8.1"
edition = "2024"
rust-version = "1.91"
description = "An implementation of edge-nal based on `embassy-net`"
repository = "https://github.com/ivmarkov/edge-net"
readme = "README.md"
license = "MIT OR Apache-2.0"
categories = [
    "embedded",
    "no-std::no-alloc",
    "asynchronous",
    "network-programming",
]

[features]
default = ["all"]
all = ["proto-ipv4", "proto-ipv6", "medium-ethernet", "medium-ip", "dns", "udp", "tcp", "multicast", "icmp", "dhcpv4", "dhcpv4-hostname"]
defmt = ["dep:defmt", "embassy-net/defmt"]
proto-ipv4 = ["embassy-net/proto-ipv4"]
proto-ipv6 = ["embassy-net/proto-ipv6"]
medium-ethernet = ["embassy-net/medium-ethernet"]
medium-ip = ["embassy-net/medium-ip"]
dns = ["embassy-net/dns"]
udp = ["embassy-net/udp"]
tcp = ["embassy-net/tcp"]
icmp = ["embassy-net/icmp"]
multicast = ["embassy-net/multicast"]
dhcpv4 = ["embassy-net/dhcpv4"]
dhcpv4-hostname = ["embassy-net/dhcpv4-hostname"]

[dependencies]
log = { version = "0.4", default-features = false, optional = true }
defmt = { version = "1", default-features = false, features = ["ip_in_core"], optional = true }
embedded-io-async = { version = "0.7", default-features = false }
edge-nal = { git = "https://github.com/ivmarkov/edge-net", rev = "1f084b41944c35b233cbe17accfbc09a56d5eaf0", default-features = false }
embassy-net = { version = "0.9.0", default-features = false }
embassy-time = { version = "0.5.1", default-features = false }
embassy-futures = { version = "0.1.2", default-features = false }
