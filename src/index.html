<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rusty Boards</title>
<style>
:root{--bg:#262626;--panel:#393939;--border:#525252;--fg:#ffffff;--mute:#a8a8a8;--accent:#6b50ff;--accent-hi:#8b7cff;--green:#34c06a;--orange:#fe8431;--red:#ff8389}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.wrap{max-width:760px;margin:0 auto;padding:24px}
header{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
h1{margin:0;color:var(--accent-hi);font-size:1.05rem;font-weight:600;letter-spacing:.04em}
.sub{color:var(--mute);font-size:.85rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red);transition:background .3s,box-shadow .3s;flex:0 0 auto}
.dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
.hero{background:var(--panel);border-radius:4px;padding:28px;text-align:center;margin-bottom:8px;border-left:3px solid var(--accent)}
.hero .label{color:var(--mute);font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.hero .v{font-size:2.6rem;color:var(--green);font-weight:600;font-variant-numeric:tabular-nums}
.hero .u{color:var(--mute);font-size:1rem;margin-left:8px}
.chart{background:var(--panel);border-radius:4px;padding:14px 18px;margin-bottom:8px}
.chart svg{display:block;width:100%;height:120px}
.chart polyline{fill:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.chart .grid{stroke:var(--mute);stroke-width:.5;opacity:.2;vector-effect:non-scaling-stroke}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.card{background:var(--panel);border-radius:4px;padding:14px 16px}
.card .k{color:var(--mute);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em}
.card .v{font-size:1.05rem;margin-top:4px;font-variant-numeric:tabular-nums}
.card.btc .v{color:var(--orange)}
</style></head><body><div class="wrap">
<header><span id="dot" class="dot"></span><h1 id="name">rusty-boards</h1><span class="sub" id="ip">connecting…</span></header>
<div class="hero"><div class="label">Hashrate</div><div><span id="hr" class="v">–</span><span id="hu" class="u">H/s</span></div></div>
<div class="chart"><svg viewBox="0 0 240 60" preserveAspectRatio="none"><line class="grid" x1="0" y1="15" x2="240" y2="15"/><line class="grid" x1="0" y1="30" x2="240" y2="30"/><line class="grid" x1="0" y1="45" x2="240" y2="45"/><polyline id="poly" points=""/></svg></div>
<div class="cards">
<div class="card"><div class="k">Uptime</div><div id="up" class="v">–</div></div>
<div class="card"><div class="k">Shares</div><div id="sh" class="v">–</div></div>
<div class="card btc"><div class="k">BTC</div><div id="btc" class="v">–</div></div>
<div class="card"><div class="k">Time</div><div id="t" class="v">–</div></div>
</div></div>
<script>
const N=120,buf=new Array(N).fill(0),$=id=>document.getElementById(id);
function fmtHr(h){if(h>=1e9)return[(h/1e9).toFixed(2),'GH/s'];if(h>=1e6)return[(h/1e6).toFixed(2),'MH/s'];if(h>=1e3)return[(h/1e3).toFixed(2),'kH/s'];return[h.toFixed(0),'H/s']}
function fmtUp(s){const d=s/86400|0,h=s/3600%24|0,m=s/60%60|0,x=s%60;return d?`${d}d ${h}h ${m}m`:h?`${h}h ${m}m ${x}s`:`${m}m ${x}s`}
function draw(){const m=Math.max(1,...buf);const p=buf.map((v,i)=>`${(i*240/(N-1)).toFixed(1)},${(60-v/m*55).toFixed(1)}`).join(' ');$('poly').setAttribute('points',p)}
async function tick(){
 try{
  const r=await fetch('/api/info',{cache:'no-store'});if(!r.ok)throw 0;
  const d=await r.json();
  $('name').textContent=d.name;
  $('ip').textContent=d.ip||'no ip';
  $('dot').className='dot live';
  const[hv,hu]=fmtHr(d.hashrate);$('hr').textContent=hv;$('hu').textContent=hu;
  $('up').textContent=fmtUp(d.uptime);
  $('sh').textContent=d.shares;
  $('btc').textContent=d.btc_cents?'$'+(d.btc_cents/100).toFixed(2):'–';
  $('t').textContent=d.time||'no ntp';
  buf.shift();buf.push(d.hashrate);draw();
 }catch(e){$('dot').className='dot'}
}
tick();setInterval(tick,2000);
</script></body></html>
