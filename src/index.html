<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>microBOS</title>
<style>
:root{--bg:#262626;--panel:#161616;--field:#393939;--border:#525252;--fg:#fff;--mute:#a8a8a8;--accent:#6b50ff;--accent-hi:#8b7cff;--green:#34c06a;--orange:#fe8431;--red:#d9222c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{display:flex;align-items:stretch;gap:4px;background:var(--panel);padding:0 20px;height:48px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;margin-right:24px;color:var(--mute);font-size:.75rem;text-transform:uppercase;letter-spacing:.12em}
.logo img{height:18px;display:block}
.logo .mu{display:inline-block;font:600 1.4rem/1 ui-serif,Georgia,serif;color:var(--accent-hi);text-shadow:0 0 4px var(--accent),0 0 10px var(--accent);letter-spacing:0;text-transform:none}
.bar a{color:var(--mute);text-decoration:none;padding:0 14px;display:flex;align-items:center;font-size:.85rem;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.06em}
.bar a:hover{color:var(--fg)}
.bar a.on{color:var(--fg);border-bottom-color:var(--accent)}
.bar .off{color:var(--mute);padding:0 14px;display:flex;align-items:center;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;opacity:.5;cursor:not-allowed}
.sp{flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red);align-self:center;transition:background .3s,box-shadow .3s}
.dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
main{display:grid;grid-template-columns:1fr 240px;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media(max-width:760px){main{grid-template-columns:1fr}}
@media(max-width:480px){
 main{padding:10px;gap:10px}
 .bar{padding:0 12px}
 .bar a,.bar .off{padding:0 8px;font-size:.78rem}
 .logo{margin-right:12px}
 .cfg{padding:16px 12px}
 .card{padding:10px 12px}
 .pool{font-size:.78rem;padding:6px 0}
 .pt{font-size:.68rem}
}
.left{display:grid;gap:16px;align-content:start;min-width:0}
.chart{background:var(--panel);border-radius:4px;padding:12px;position:relative}
.chart svg{display:block;width:100%;height:auto}
.gr{stroke:var(--border);stroke-width:.5;opacity:.5;vector-effect:non-scaling-stroke}
.tk{stroke:var(--mute);stroke-width:.5;vector-effect:non-scaling-stroke}
.ax{fill:var(--mute);font-size:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.hrL{fill:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.tpL{fill:none;stroke:var(--orange);stroke-width:1.5;vector-effect:non-scaling-stroke}
.lg{text-align:center;margin-top:8px;font-size:.7rem;color:var(--mute)}
.lg span{display:inline-block;width:10px;height:2px;vertical-align:middle;margin:0 6px}
.side{display:grid;gap:8px;align-content:start}
.card{background:var(--panel);border-radius:4px;padding:12px 14px}
.k{color:var(--mute);font-size:.65rem;text-transform:uppercase;letter-spacing:.1em}
.pools .k{margin-bottom:6px}
.pool{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem}
.pools .pool:first-of-type{border-top:0}
.ps{display:flex;align-items:center;gap:8px}
.ps .dot{align-self:auto}
.pt{color:var(--mute);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;min-width:3em;text-align:right}
.pool.live .pt{color:var(--green)}
.pool.live .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.v{font-size:1.05rem;margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.cfg{max-width:520px;margin:0 auto;padding:24px 16px}
.cfg h2{color:var(--accent-hi);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;margin:24px 0 4px;border-bottom:1px solid var(--border);padding-bottom:6px}
.cfg label{display:block;color:var(--mute);font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;margin:10px 0 2px}
.cfg input{width:100%;background:var(--field);color:var(--fg);border:0;border-bottom:1px solid var(--border);padding:8px 10px;font:13px ui-monospace,monospace}
.cfg input:focus{outline:0;border-bottom-color:var(--accent)}
.cfg button{margin-top:20px;background:var(--accent);color:#fff;border:0;padding:10px 24px;font-weight:600;letter-spacing:.04em;cursor:pointer;text-transform:uppercase;font-size:.8rem}
.cfg button:hover{background:var(--accent-hi)}
.msg{margin-top:12px;color:var(--green);font-size:.8rem;min-height:1.2em}
.hide{display:none}
</style></head><body>
<nav class="bar">
<span class="logo"><img src="/logo.svg" alt="Braiins"><span class="mu">µ</span></span>
<a href="#" id="nDash">Dashboard</a>
<a href="#config" id="nCfg">Configuration</a>
<span class="sp"></span>
<span class="off" title="not implemented yet">Log out</span>
<span class="dot" id="dot" title="link"></span>
</nav>
<main id="dash">
<div class="left">
<div class="chart">
<svg viewBox="0 0 680 320" preserveAspectRatio="xMidYMid meet">
<g id="grid"></g><g id="yL"></g><g id="yR"></g><g id="xA"></g>
<polyline id="hrLine" class="hrL"/><polyline id="tpLine" class="tpL"/>
</svg>
<div class="lg"><span style="background:#6b50ff"></span>Hashrate<span style="background:#fe8431"></span>Temp</div>
</div>
<div class="card pools">
<div class="k">Pools</div>
<div class="pool" id="po1"><span>Pool 1 — Primary</span><span class="ps"><span class="dot"></span><span class="pt">Dead</span></span></div>
<div class="pool" id="po2"><span>Pool 2 — Backup</span><span class="ps"><span class="dot"></span><span class="pt">Dead</span></span></div>
<div class="pool" id="po3"><span>Pool 3 — Backup</span><span class="ps"><span class="dot"></span><span class="pt">Dead</span></span></div>
</div>
</div>
<aside class="side">
<div class="card"><div class="k">Hashrate</div><div id="hr" class="v">–</div></div>
<div class="card"><div class="k">IP address</div><div id="ip" class="v">–</div></div>
<div class="card"><div class="k">Time (UTC)</div><div id="t" class="v">–</div></div>
<div class="card"><div class="k">Uptime</div><div id="up" class="v">–</div></div>
<div class="card"><div class="k">Fan speed</div><div id="fs" class="v">–</div></div>
<div class="card"><div class="k">Fan PWM</div><div id="fp" class="v">–</div></div>
</aside>
</main>
<section class="cfg hide" id="cfg">
<form id="cfgForm">
<h2>Pool 1 — Primary</h2>
<label>URL<input name="url1" placeholder="stratum+tcp://host:port"></label>
<label>Username<input name="user1"></label>
<label>Password<input name="pass1" type="password"></label>
<h2>Pool 2 — Backup</h2>
<label>URL<input name="url2"></label>
<label>Username<input name="user2"></label>
<label>Password<input name="pass2" type="password"></label>
<h2>Pool 3 — Backup</h2>
<label>URL<input name="url3"></label>
<label>Username<input name="user3"></label>
<label>Password<input name="pass3" type="password"></label>
<button type="submit">Save</button>
<div class="msg" id="msg"></div>
</form>
</section>
<script>
const N=150,W=680,H=320,L=44,R=44,T=10,B=20,PW=W-L-R,PH=H-T-B;
const hrBuf=new Array(N).fill(0),tpBuf=new Array(N).fill(0);
const $=id=>document.getElementById(id);
function route(){const c=location.hash==='#config';$('dash').classList.toggle('hide',c);$('cfg').classList.toggle('hide',!c);$('nDash').classList.toggle('on',!c);$('nCfg').classList.toggle('on',c)}
addEventListener('hashchange',route);route();
function fmtHr(h){if(h>=1e12)return(h/1e12).toFixed(2)+' TH/s';if(h>=1e9)return(h/1e9).toFixed(2)+' GH/s';if(h>=1e6)return(h/1e6).toFixed(2)+' MH/s';if(h>=1e3)return(h/1e3).toFixed(2)+' kH/s';return h.toFixed(0)+' H/s'}
function fmtUp(s){const d=s/86400|0,h=s/3600%24|0,m=s/60%60|0;return d?`${d}d ${h}h ${m}m`:h?`${h}h ${m}m`:`${m}m ${s%60|0}s`}
function ceil(v,s){return Math.max(s,Math.ceil(v/s)*s)}
function draw(){
 const tpMaj=20,tpMin=10;
 const hrPeak=Math.max(...hrBuf);
 const hrMaj=Math.max(1e12,ceil(hrPeak/4,1e12)),hrMin=hrMaj/2;
 const hrMax=ceil(hrPeak,hrMaj),tpMax=ceil(Math.max(...tpBuf),tpMaj);
 let g='',yl='',yr='',xa='';
 for(let v=0;v<=hrMax;v+=hrMin){const y=T+PH-(v/hrMax)*PH,maj=v%hrMaj===0;
  if(maj){g+=`<line class="gr" x1="${L}" y1="${y}" x2="${L+PW}" y2="${y}"/>`;yl+=`<text class="ax" x="${L-6}" y="${y+3}" text-anchor="end">${(v/1e12).toFixed(0)}T</text>`}
  else{yl+=`<line class="tk" x1="${L-3}" y1="${y}" x2="${L}" y2="${y}"/>`}}
 for(let v=0;v<=tpMax;v+=tpMin){const y=T+PH-(v/tpMax)*PH,maj=v%tpMaj===0;
  if(maj){yr+=`<text class="ax" x="${L+PW+6}" y="${y+3}">${v}°C</text>`}
  else{yr+=`<line class="tk" x1="${L+PW}" y1="${y}" x2="${L+PW+3}" y2="${y}"/>`}}
 for(let m=0;m<=5;m++){const x=L+(m/5)*PW;
  g+=`<line class="gr" x1="${x}" y1="${T}" x2="${x}" y2="${T+PH}"/>`;
  xa+=`<text class="ax" x="${x}" y="${H-6}" text-anchor="middle">-${5-m}m</text>`}
 $('grid').innerHTML=g;$('yL').innerHTML=yl;$('yR').innerHTML=yr;$('xA').innerHTML=xa;
 const pts=(b,m)=>b.map((v,i)=>`${(L+i*PW/(N-1)).toFixed(1)},${(T+PH-(v/m)*PH).toFixed(1)}`).join(' ');
 $('hrLine').setAttribute('points',pts(hrBuf,hrMax));$('tpLine').setAttribute('points',pts(tpBuf,tpMax));
}
async function tick(){
 try{const r=await fetch('/api/info',{cache:'no-store'});if(!r.ok)throw 0;
  const d=await r.json();
  $('dot').className='dot live';
  $('hr').textContent=fmtHr(d.hashrate);
  $('ip').textContent=d.ip||'–';
  $('t').textContent=d.time||'–';
  $('up').textContent=fmtUp(d.uptime);
  $('fs').textContent=d.fan_rpm?d.fan_rpm+' RPM':'–';
  $('fp').textContent=d.fan_pwm?d.fan_pwm+' %':'–';
  const pm=d.pools|0;
  for(let i=0;i<3;i++){const el=$('po'+(i+1)),a=(pm>>i)&1;el.classList.toggle('live',!!a);el.querySelector('.pt').textContent=a?'Alive':'Dead'}
  hrBuf.shift();hrBuf.push(d.hashrate);
  tpBuf.shift();tpBuf.push(d.temperature||0);
  draw();
 }catch(e){$('dot').className='dot'}
}
tick();setInterval(tick,2000);
$('cfgForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const body=JSON.stringify(Object.fromEntries(new FormData(e.target)));
 try{const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body});
  $('msg').textContent=r.ok?'Saved (logged to firmware console).':'Save failed.'}
 catch(_){$('msg').textContent='Save failed.'}
});
</script></body></html>
