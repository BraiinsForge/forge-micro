[package]
publish.workspace = true
license.workspace = true
edition.workspace = true
name    = "host-runner"
version = "0.1.0"

[lints]
workspace = true

[dependencies]
# Selects the std-backed critical-section impl for the host binary.
# `CriticalSectionRawMutex` in the ubos-* libraries needs an impl
# linked; firmware gets it from cortex-m/embassy-rp/esp-hal, the host
# binary must pick the std backend explicitly.
critical-section   = { version = "1.2", features = ["std"] }
ctrlc              = "3"
edge-nal-embassy   = { workspace = true, features = ["tcp", "proto-ipv4", "medium-ethernet"] }
embassy-executor     = { workspace = true, features = ["platform-std", "executor-thread", "log"] }
embassy-futures    = { workspace = true }
embassy-net          = { workspace = true, features = ["log", "tcp", "udp", "dns", "dhcpv4", "medium-ethernet", "proto-ipv4", "auto-icmp-echo-reply"] }
embassy-time         = { workspace = true, features = ["std", "log"] }
embedded-i2c-unix    = { path = "../embedded-i2c-unix" }
embedded-serial-unix = { path = "../embedded-serial-unix" }
env_logger         = "0.11"
gpiocdev           = "0.8"
heapless           = { workspace = true }
# `alloc` enables `CryptoCtx::new()` (heap-allocated secp256k1
# context). The firmware uses `lowmemory` + preallocated buffers to
# fit the verification table in SRAM; on host neither constraint
# applies, so prefer the simpler allocating path.
ii-sv2             = { workspace = true, features = ["alloc"] }
log                = { version = "0.4", default-features = false }
rand               = "0.10"
sha2               = { workspace = true }
static_cell        = { workspace = true }
stratum-client     = { workspace = true }
stratum-v1         = { workspace = true }
stratum-v2         = { workspace = true }
ubos-api           = { workspace = true, default-features = false }
ubos-asic          = { workspace = true }
ubos-auth          = { workspace = true, default-features = false }
ubos-config        = { workspace = true, default-features = false, features = ["std"] }
ubos-cooling       = { workspace = true, default-features = false }
ubos-core          = { workspace = true }
ubos-http          = { workspace = true, default-features = false }
ubos-machine       = { workspace = true }
ubos-manager       = { workspace = true, default-features = false }
ubos-mdns          = { workspace = true, default-features = false }
ubos-metrics       = { workspace = true, default-features = false, features = ["metrics"] }
ubos-mining         = { workspace = true }
ubos-net           = { workspace = true, default-features = false }
ubos-prometheus    = { workspace = true, default-features = false }
ubos-psu           = { workspace = true }
ubos-temperature   = { workspace = true, default-features = false }
ubos-thermal       = { workspace = true, default-features = false }
ubos-webui         = { workspace = true, default-features = false }

# Bridged networking (afpacket) on the miniminer target; TAP on the dev
# host. Selected by target_arch in src/hosted_network.rs.
[target.'cfg(target_arch = "arm")'.dependencies]
embassy-net-afpacket = { path = "../embassy-net-afpacket" }

[target.'cfg(not(target_arch = "arm"))'.dependencies]
embassy-net-tuntap   = "0.1"

[build-dependencies]
ubos-build = { workspace = true }

# critical-section is depended on only for its std impl symbols, linked
# but never named in source, so machete cannot see the use.
[package.metadata.cargo-machete]
ignored = ["critical-section"]
