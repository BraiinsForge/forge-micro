[package]
publish.workspace = true
license.workspace = true
name        = "embedded-i2c-unix"
edition.workspace = true
version     = "0.1.0"
description = "Async embedded-hal-async I2C adapter over Linux /dev/i2c-N."

[lints]
workspace = true

[dependencies]
embedded-hal       = { workspace = true }
embedded-hal-async = { workspace = true }
libc               = "0.2"

# embedded-hal is used for trait bounds; cargo-shear does not see trait-only usage.
[package.metadata.cargo-shear]
ignored = ["embedded-hal"]
