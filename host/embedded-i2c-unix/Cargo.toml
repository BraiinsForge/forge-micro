[package]
name        = "embedded-i2c-unix"
edition     = "2021"
version     = "0.1.0"
description = "Async embedded-hal-async I2C adapter over Linux /dev/i2c-N."

[lints]
workspace = true

[dependencies]
embedded-hal       = { workspace = true }
embedded-hal-async = { workspace = true }
libc               = "0.2"

# embedded-hal is used for trait bounds; machete does not see trait-only usage.
[package.metadata.cargo-machete]
ignored = ["embedded-hal"]
