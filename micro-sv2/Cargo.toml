[workspace]
resolver = "3"
members = ["crypto", "framing", "messages", "security", "types"]
# Excluded from the workspace — pulls a proprietary registry dep that
# we don't want in the default cargo motion. Run on demand with
# `cargo test --manifest-path interop-test/Cargo.toml`.
exclude = ["interop-test"]

[workspace.dependencies]
serde            = { version = "1",      default-features = false, features = ["derive"] }
secp256k1        = { version = "0.31",   default-features = false }
sha2             = { version = "0.10",   default-features = false }
hkdf             = { version = "0.12",   default-features = false }
chacha20poly1305 = { version = "0.10",   default-features = false }
bs58             = { version = "0.5",    default-features = false, features = ["check"] }
embedded-io-async = { version = "0.6",   default-features = false }
