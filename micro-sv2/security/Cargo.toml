[package]
name = "ii-sv2-security"
version = "0.1.0"
edition = "2024"

[dependencies]
ii-sv2-crypto     = { path = "../crypto" }
ii-sv2-framing    = { path = "../framing" }
ii-sv2-types      = { path = "../types" }
secp256k1         = { workspace = true }
bs58              = { workspace = true }
sha2              = { workspace = true }
embedded-io-async = { workspace = true }

[dev-dependencies]
ii-sv2-messages      = { path = "../messages" }
secp256k1            = { workspace = true, features = ["alloc"] }
rand                 = "0.9"
tokio                = { version = "1", features = ["rt", "macros", "io-util"] }
embedded-io-adapters = { version = "0.6", features = ["tokio-1"] }
