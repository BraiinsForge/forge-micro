[package]
name = "ii-sv2"
version = "0.2.0"
edition = "2024"

[features]
default = ["alloc"]
alloc = ["ii-sv2-security/alloc"]
lowmemory = ["ii-sv2-security/lowmemory"]

[dependencies]
ii-sv2-types    = { path = "../types" }
ii-sv2-framing  = { path = "../framing" }
ii-sv2-messages = { path = "../messages" }
ii-sv2-security = { path = "../security", default-features = false }

[dev-dependencies]
anyhow                = "1"
clap                  = { version = "4", features = ["derive"] }
embedded-io-adapters  = { version = "0.7", features = ["tokio-1"] }
embedded-io-async     = { workspace = true, features = ["std"] }
rand                  = "0.9"
tokio                 = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "signal"] }
tracing               = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter", "fmt"] }

[[example]]
name = "debug_sv2_server"
required-features = ["alloc"]
