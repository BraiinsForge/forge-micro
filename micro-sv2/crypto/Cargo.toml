[package]
name = "ii-sv2-crypto"
version = "0.1.0"
edition = "2024"

[features]
default = ["alloc"]
alloc = ["secp256k1/alloc"]

[dependencies]
secp256k1        = { workspace = true }
sha2             = { workspace = true }
hkdf             = { workspace = true }
chacha20poly1305 = { workspace = true }

[dev-dependencies]
# Tests run on the host with std; pull in the alloc context constructor.
secp256k1 = { workspace = true, features = ["alloc"] }
rand      = "0.9"
