[package]
edition = "2021"
name    = "ubos-backend"
version = "0.1.0"

[lints]
workspace = true

[features]
default = ["defmt"]
defmt   = [
    "dep:defmt",
    "cpu-miner/defmt",
    "embassy-net/defmt",
    "embassy-sync/defmt",
    "embassy-time/defmt",
    "ubos-logging/defmt",
]

[dependencies]
asic-interface    = { workspace = true }
cpu-miner         = { workspace = true }
embassy-futures   = { workspace = true }
embassy-net       = { workspace = true, features = ["tcp", "medium-ethernet", "proto-ipv4"] }
embassy-sync      = { workspace = true }
embassy-time      = { workspace = true }
defmt             = { workspace = true, optional = true }
embedded-io-async = { workspace = true }
heapless          = { workspace = true }
portable-atomic   = { workspace = true }
sha2              = { workspace = true }
static_cell       = { workspace = true }
stratum-v1-core   = { workspace = true }
ubos-logging      = { workspace = true }
